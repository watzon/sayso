# The cleanup runtime: the sayso-cleanup sidecar. It loads a GGUF file with
# llama.cpp and completes text. Its own workspace, so the app workspace does
# not build llama.cpp. See NOTES.md.
[workspace]
resolver = "3"

[package]
name = "sayso-cleanup"
description = "Local text-cleanup runtime for Sayso: llama.cpp behind a JSON-lines protocol."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
name = "sayso_cleanup"
path = "src/lib.rs"

[[bin]]
name = "sayso-cleanup"
path = "src/main.rs"
test = false

[dependencies]
sayso-core = { path = "../../crates/sayso-core" }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.10", default-features = false }
# Default features are off on purpose: no OpenMP (no libgomp on Linux), no
# `common` (llama.cpp's CLI helpers), no Android C++ runtime.
llama-cpp-2 = { version = "=0.1.160", default-features = false }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["metal"] }

[profile.release]
debug = false
