[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
# The MIT crates carry a version, because cargo publish needs one for a path
# dependency. Change it with the workspace version (scripts/check-deps.sh checks).
sayso-protocol = { path = "crates/sayso-protocol", version = "0.16.0" }
sayso-engine-sdk = { path = "crates/sayso-engine-sdk", version = "0.16.0" }
sayso-speech = { path = "crates/sayso-speech", version = "0.16.0" }
sayso-capture = { path = "crates/sayso-capture", version = "0.16.0" }
sayso-cleanup-models = { path = "crates/sayso-cleanup-models", version = "0.16.0" }
sayso-cleanup-client = { path = "crates/sayso-cleanup-client", version = "0.16.0" }
sayso-sdk = { path = "crates/sayso-sdk", version = "0.16.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
sha2 = "0.10"
tempfile = "3"

# Debug information is most of the size of target/. Workspace crates keep
# file and line numbers for backtraces. Dependencies keep none: on macOS their
# debug information stays in target/ as one object file per codegen unit.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release builds trade build time for size: fat LTO and one codegen unit make
# the sayso binary about a third smaller, and strip drops the symbol table.
# Do not set panic = "abort": the hotkey hooks recover from panics with
# catch_unwind. Thin LTO gives a larger binary than fat LTO here.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
