[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
sayso-core = { path = "crates/sayso-core" }
sayso-platform = { path = "crates/sayso-platform" }
sayso-platform-macos = { path = "crates/sayso-platform-macos" }
sayso-platform-windows = { path = "crates/sayso-platform-windows" }
sayso-engine-client = { path = "crates/sayso-engine-client" }
sayso-store = { path = "crates/sayso-store" }
sayso-enhance = { path = "crates/sayso-enhance" }
sayso-transcribe = { path = "crates/sayso-transcribe" }
sayso-ui = { path = "crates/sayso-ui" }

# UI. Exact pins: gpui-pre snapshots break the API between versions.
gpui-kit = "=0.7.0"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
tempfile = "3"
