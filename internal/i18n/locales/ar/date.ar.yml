_version: 1

# Arguments: %{weekday}, %{month}, %{day}, %{year}. Put them in the order of
# the language, with its words between them ("%{day} de %{month}").
date:
  pattern:
    # In a narrow column of lists: keep it to about 6 characters.
    day_month_short: "%{day} %{month}"
    day_month: "%{day} %{month}"
    weekday_day_month: "%{weekday}، %{day} %{month}"
    day_month_year: "%{day} %{month} %{year}"
  today: "اليوم"
  yesterday: "أمس"
  month:
    january: "يناير"
    february: "فبراير"
    march: "مارس"
    april: "أبريل"
    may: "مايو"
    june: "يونيو"
    july: "يوليو"
    august: "أغسطس"
    september: "سبتمبر"
    october: "أكتوبر"
    november: "نوفمبر"
    december: "ديسمبر"
  month_short:
    january: "يناير"
    february: "فبراير"
    march: "مارس"
    april: "أبريل"
    may: "مايو"
    june: "يونيو"
    july: "يوليو"
    august: "أغسطس"
    september: "سبتمبر"
    october: "أكتوبر"
    november: "نوفمبر"
    december: "ديسمبر"
  weekday:
    monday: "الاثنين"
