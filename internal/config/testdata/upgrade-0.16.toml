# A config.toml as the Rust app of 0.14 to 0.16 wrote it (Config::to_toml),
# with the choices of a user who set things up: before [telemetry], and with
# input_device as the cpal id "<host>:<device id>".
[general]
launch_at_login = true
dock_icon_with_hub = false
language = "de"

[hotkeys]
toggle = "right_option"
push_to_talk = "ctrl+opt+d"
cancel = "single_escape"
double_escape_ms = 400
paste_last = "ctrl+cmd+v"
cycle_style = "ctrl+opt+s"
incognito = "ctrl+shift+i"
enter_sends = true
take_escape = true

[style_hotkeys]
email = "ctrl+opt+e"

[dictation]
language = "auto"
model = "parakeet-tdt-v3"
preview_model = "auto"
live_preview = true
spoken_punctuation = true
min_duration_ms = 300
max_duration_s = 600
preload_model = true

[insertion]
restore_clipboard = true
restore_delay_ms = 450
type_in_apps = ["com.googlecode.iterm2"]
smart_spacing = true
trailing_space = false

[overlay]
style = "pill"
notch_on_other_displays = true
idle_pill = false
hide_in_fullscreen = true
follow_display = true
show_preview = true
size = "small"

[audio]
input_device = "coreaudio:BuiltInMicrophoneDevice"
pause_media = true

[sounds]
enabled = true
volume = 0.6
start = true
stop = false
cancel = true
insert = false

[ai]
enabled = true
active_style = "email"
default_provider = "claude-code"
http_timeout_ms = 4000
cli_timeout_ms = 8000

[[ai.providers]]
id = "claude-code"
name = "Claude Code"
kind = "claude_cli"
model = "sonnet"

[[ai.providers]]
id = "openrouter"
name = "OpenRouter"
kind = "open_ai_compatible"
base_url = "https://openrouter.ai/api/v1"
model = "openai/gpt-5-mini"
api_key_account = "openrouter"
zero_data_retention = true

[ai.style_rules]
enabled = true
seeded = true

[[ai.style_rules.rules]]
style = "email"
apps = ["com.apple.mail"]

[speech]
providers = []
timeout_ms = 30000

[models]
vad = "auto"
diarization = "auto"

[history]
enabled = true
save_audio = true
keep_audio_days = 7
site_icons = false

[appearance]
theme = "dark"
ink = "indigo"
paper_texture = false
system_title_bar = true
sidebar_collapsed = true

[updates]
check = true
automatic = true

[advanced]

[onboarding]
completed = true
step = 6
