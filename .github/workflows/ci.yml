name: CI

# A push runs only the dependency-rule check, which needs no build and takes seconds.
# A change to only documents (Markdown, docs/, the license, the funding file) runs nothing.
# The test suite builds GPUI and takes minutes, so it runs only when you start it:
#   gh workflow run ci.yml
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-rules:
    name: Dependency rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # cargo-hakari checks that workspace-hack is current. It resolves the
      # dependencies, but builds nothing.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari@0.9.39
      # The other rules read only the manifests (cargo metadata --no-deps).
      - name: Check the dependency rules
        run: RUSTUP_TOOLCHAIN=stable scripts/check-deps.sh
      # The translated system files must match the system catalogs.
      - name: Check the translated system files
        run: python3 scripts/i18n-system-files.py --check
      # The Rust code in docs/sdk-guide must be the code of the examples that CI compiles.
      - name: Check the code of the SDK guide
        run: python3 scripts/check-sdk-guide.py

  test:
    name: Tests and clippy (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The Rust engine and the fake engine run the suite in cargo test. The
      # Swift engine is not a Cargo crate, so it runs the suite here.
      - name: Engine conformance, Swift engine
        run: |
          swift build -c release --package-path native/macos/SaysoEngine
          cargo run -q -p sayso-engine-conformance -- native/macos/SaysoEngine/.build/release/SaysoEngine \
            --model parakeet-tdt-v2 --engine-json '{"kind":"parakeet_tdt","version":"v2"}' \
            --store silero-vad '{"kind":"fluid_vad"}'

  test-linux:
    name: Tests and clippy, Linux (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the build packages
        run: scripts/linux-deps.sh
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its native library to target/sherpa-onnx-prebuilt
      # and links from there. The cache keeps the folders in that path, but
      # deletes the files in them, and the build script does not download when
      # the lib folder is there. When no library file is there, remove the
      # folder and clean the crate, so the build script downloads again.
      # Without this, a change to Cargo.lock fails with "could not find native
      # static library sherpa-onnx-c-api".
      - name: Get the sherpa-onnx library again when the cache does not have it
        shell: bash
        run: |
          libs=$(find target/sherpa-onnx-prebuilt -type f \( -name '*.a' -o -name '*.lib' \) 2>/dev/null | head -n 1 || true)
          if [[ -z "$libs" ]]; then
            rm -rf target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys
            cargo clean -p sherpa-onnx-sys --release
          fi
      - name: Test
        run: cargo test --workspace
      - name: Two engines on one model store
        run: cargo test -p sayso-engine --test conformance -- --ignored
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-windows:
    name: Tests and clippy, Windows (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # sherpa-onnx-sys downloads its native library to target/sherpa-onnx-prebuilt
      # and links from there. The cache keeps the folders in that path, but
      # deletes the files in them, and the build script does not download when
      # the lib folder is there. When no library file is there, remove the
      # folder and clean the crate, so the build script downloads again.
      # Without this, a change to Cargo.lock fails with "could not find native
      # static library sherpa-onnx-c-api".
      - name: Get the sherpa-onnx library again when the cache does not have it
        shell: bash
        run: |
          libs=$(find target/sherpa-onnx-prebuilt -type f \( -name '*.a' -o -name '*.lib' \) 2>/dev/null | head -n 1 || true)
          if [[ -z "$libs" ]]; then
            rm -rf target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys
            cargo clean -p sherpa-onnx-sys --release
          fi
      - name: Test
        run: cargo test --workspace
      - name: Two engines on one model store
        run: cargo test -p sayso-engine --test conformance -- --ignored
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # The cleanup runtime (native/cleanup, the sayso-cleanup binary) is its own
  # Cargo workspace. It builds llama.cpp with CMake, so no job above builds it.
  # One job for each target that Sayso ships. It reports the size and the
  # libraries of the binary, and fails on OpenMP (libgomp, libomp, vcomp):
  # the runtime must need no library that the system does not have.
  cleanup-runtime:
    name: Cleanup runtime, ${{ matrix.name }} (manual)
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
          - name: Windows x86_64
            runner: windows-2025
          - name: Linux x86_64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: native/cleanup
    steps:
      - uses: actions/checkout@v4
      - name: Install the build packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev
      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/cleanup
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Size and libraries of the binary
        run: |
          case "$RUNNER_OS" in
            Windows) binary=target/release/sayso-cleanup.exe ;;
            *) binary=target/release/sayso-cleanup ;;
          esac
          ls -l "$binary"
          echo "size: $(wc -c < "$binary") bytes"
          case "$RUNNER_OS" in
            macOS)
              deps=$(otool -L "$binary")
              # Only system libraries: llama.cpp and ggml are linked statically.
              if tail -n +2 <<< "$deps" | grep -vE '^[[:space:]]*(/System/Library/|/usr/lib/)'; then
                echo "::error::The cleanup runtime links a library that is not part of macOS."
                exit 1
              fi ;;
            Linux) deps=$(ldd "$binary") ;;
            Windows)
              # llvm-readobj comes with LLVM. dumpbin comes with Visual Studio.
              readobj="/c/Program Files/LLVM/bin/llvm-readobj.exe"
              if [[ -x "$readobj" ]]; then
                deps=$("$readobj" --coff-imports "$binary" | grep -E 'Name:.*\.(dll|DLL)')
              else
                vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath)
                dumpbin=$(find "$(cygpath -u "$vs")/VC/Tools/MSVC" -path '*Hostx64/x64/dumpbin.exe' | sort | tail -1)
                deps=$("$dumpbin" //dependents "$binary")
              fi ;;
          esac
          echo "$deps"
          if grep -qiE 'libgomp|libomp|vcomp' <<< "$deps"; then
            echo "::error::The cleanup runtime needs an OpenMP library. The llama-cpp-2 features must stay off (native/cleanup/Cargo.toml)."
            exit 1
          fi
          if grep -q 'not found' <<< "$deps"; then
            echo "::error::The cleanup runtime has a library that is missing."
            exit 1
          fi

  # The engine release files, and their check on clean runners. The Release
  # workflow makes the same files from the signed and notarized app. CI has no
  # signing certificate and cannot notarize, so these jobs pack the engine of an
  # unsigned build (macOS: an ad hoc signature) with the same scripts. The
  # check is the same too (engine-check.yml). Each file is the artifact
  # release-engine-<os>-<arch>. The files are real builds of the whole app, so
  # the jobs are slow.
  engine-file-macos:
    name: Engine file, macOS arm64 (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # The cleanup runtime (native/cleanup) is its own Cargo workspace.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            native/cleanup
      # "-" signs ad hoc, because CI has no Developer ID certificate.
      - name: Build the app bundle, not signed with a Developer ID
        env:
          SAYSO_BUNDLE_DIR: dist
          SAYSO_SIGN_IDENTITY: "-"
        run: scripts/bundle.sh
      - name: Make the engine release file
        run: scripts/package-engine.sh dist/Sayso.app/Contents/MacOS/SaysoEngine
      - name: Keep the engine release file
        uses: actions/upload-artifact@v4
        with:
          name: release-engine-macos-arm64
          path: dist/sayso-engine-*-macos-arm64.tar.gz
          if-no-files-found: error

  # The Intel engine is a cross-compile of the Swift engine alone. The job
  # needs no Rust and no app bundle, and Sayso has no Intel app.
  engine-file-macos-x86_64:
    name: Engine file, macOS x86_64 (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # "-" signs ad hoc, because CI has no Developer ID certificate. The
      # script then does not notarize.
      - name: Build the Intel engine, not signed with a Developer ID
        env:
          SAYSO_SIGN_IDENTITY: "-"
        run: scripts/build-engine-x86_64.sh
      - name: Make the engine release file
        run: scripts/package-engine.sh dist/engine-x86_64/SaysoEngine
      - name: Keep the engine release file
        uses: actions/upload-artifact@v4
        with:
          name: release-engine-macos-x86_64
          path: dist/sayso-engine-*-macos-x86_64.tar.gz
          if-no-files-found: error

  engine-file-windows:
    name: Engine file, Windows x86_64 (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            native/cleanup
      - name: Install CMake and Inno Setup
        run: |
          choco install cmake innosetup --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # Same as the test jobs above: the cache can keep the folders of the
      # sherpa-onnx library without its files.
      - name: Get the sherpa-onnx library again when the cache does not have it
        shell: bash
        run: |
          libs=$(find target/sherpa-onnx-prebuilt -type f \( -name '*.a' -o -name '*.lib' \) 2>/dev/null | head -n 1 || true)
          if [[ -z "$libs" ]]; then
            rm -rf target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys
            cargo clean -p sherpa-onnx-sys --release
          fi
      # No SAYSO_SIGN_CERT, so nothing is signed. The installer is for tests on a VM.
      - name: Build the app folder and the installer, not signed
        run: scripts\bundle-windows.ps1 -Installer
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: test-windows-installer
          path: dist/Sayso-*-windows-x64-setup.exe
          if-no-files-found: error
      - name: Make the engine release file
        run: scripts\package-engine.ps1
      - name: Keep the engine release file
        uses: actions/upload-artifact@v4
        with:
          name: release-engine-windows-x64
          path: dist/sayso-engine-*-windows-x64.zip
          if-no-files-found: error

  # The Linux files come from linux.yml (the Ubuntu 22.04 build of the release),
  # without the packages, which the check does not need.
  engine-file-linux:
    name: Engine file, Linux
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/linux.yml
    with:
      ref: ${{ github.sha }}
      skip_packages: true

  engine-check:
    name: Engine file check
    if: github.event_name == 'workflow_dispatch'
    needs: [engine-file-macos, engine-file-macos-x86_64, engine-file-windows, engine-file-linux]
    uses: ./.github/workflows/engine-check.yml
    with:
      ref: ${{ github.sha }}
