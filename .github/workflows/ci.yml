name: CI

# A push runs only the dependency-rule check, which needs no build and takes seconds.
# The test suite builds GPUI and takes minutes, so it runs only when you start it:
#   gh workflow run ci.yml
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-rules:
    name: Dependency rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # cargo metadata --no-deps reads only the manifests, so the runner's own cargo is enough.
      - name: Check the dependency rules
        run: RUSTUP_TOOLCHAIN=stable scripts/check-deps.sh

  test:
    name: Tests and clippy (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: Tests and clippy, Linux (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the build packages
        run: scripts/linux-deps.sh
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its native library to target/sherpa-onnx-prebuilt
      # and links from there. The cache keeps the folders in that path, but
      # deletes the files in them, and the build script does not download when
      # the lib folder is there. When no library file is there, remove the
      # folder and clean the crate, so the build script downloads again.
      # Without this, a change to Cargo.lock fails with "could not find native
      # static library sherpa-onnx-c-api".
      - name: Get the sherpa-onnx library again when the cache does not have it
        shell: bash
        run: |
          libs=$(find target/sherpa-onnx-prebuilt -type f \( -name '*.a' -o -name '*.lib' \) 2>/dev/null | head -n 1 || true)
          if [[ -z "$libs" ]]; then
            rm -rf target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys
            cargo clean -p sherpa-onnx-sys --release
          fi
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-windows:
    name: Tests and clippy, Windows (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            native/portable
      - name: Install CMake
        shell: pwsh
        run: |
          choco install cmake --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # sherpa-onnx-sys downloads its native library to target/sherpa-onnx-prebuilt
      # and links from there. The cache keeps the folders in that path, but
      # deletes the files in them, and the build script does not download when
      # the lib folder is there. When no library file is there, remove the
      # folder and clean the crate, so the build script downloads again.
      # Without this, a change to Cargo.lock fails with "could not find native
      # static library sherpa-onnx-c-api".
      - name: Get the sherpa-onnx library again when the cache does not have it
        shell: bash
        run: |
          libs=$(find target/sherpa-onnx-prebuilt -type f \( -name '*.a' -o -name '*.lib' \) 2>/dev/null | head -n 1 || true)
          if [[ -z "$libs" ]]; then
            rm -rf target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys
            cargo clean -p sherpa-onnx-sys --release
          fi
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test the speech engine
        run: cargo test --manifest-path native/portable/Cargo.toml
