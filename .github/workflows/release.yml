name: Release

# Publish a GitHub release, and this workflow builds the app and attaches the files to it.
# To build again for a release that exists: gh workflow run release.yml -f tag=v0.1.0
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of a release that exists (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# One job for each platform. Each job builds its files and attaches them to the release.
# Add the Windows job and the Linux job next to the macOS job.
jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the tag against the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::The tag is $TAG, but Cargo.toml has version $version. The tag must be v$version."
            exit 1
          fi

      - name: Check the signing secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The secret $name is not set. See docs/releasing.md."
              missing=1
            fi
          done
          exit $missing

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, and notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # Set this repository variable only if the certificate is not the default in scripts/bundle.sh.
          SIGN_IDENTITY: ${{ vars.SAYSO_SIGN_IDENTITY }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          [[ -n "$SIGN_IDENTITY" ]] && export SAYSO_SIGN_IDENTITY="$SIGN_IDENTITY"
          scripts/release.sh

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.dmg dist/*.dmg.sha256 --clobber

      - name: Delete the keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
