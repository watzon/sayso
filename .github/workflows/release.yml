name: Release

# Publish a GitHub release as a prerelease, and this workflow builds the app,
# attaches the files, signs the update manifest (latest.json), and then makes
# the release the latest release. Users get a release only after that last
# step, so a release with a missing file never reaches the updater.
# docs/updates.md, "Release pipeline", has the reasons.
#
# To build again for a release that is still a prerelease: gh workflow run release.yml -f tag=v0.1.0
# A release that users already get is never changed. Make a new version instead.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of a release that exists (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Turns the updater on in the app (sayso-update, official_build).
  SAYSO_OFFICIAL_BUILD: "1"

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

# One job for each platform. Each job builds its files and keeps them as a
# workflow artifact for the manifest job. The macOS and Windows jobs also
# attach them to the release.
jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      # Each job reads the live state, so a new run and a rerun of one job obey it.
      - name: Stop when users already get this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]]; then
            echo "::error::The release $TAG is not a prerelease, so users already get it. This workflow does not change it. Make a new version."
            exit 1
          fi

      - name: Check the tag against the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::The tag is $TAG, but Cargo.toml has version $version. The tag must be v$version."
            exit 1
          fi

      - name: Check the signing secrets
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The secret $name is not set. See docs/releasing.md."
              missing=1
            fi
          done
          exit $missing

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import the Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, and notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # Set this repository variable only if the certificate is not the default in scripts/bundle.sh.
          SIGN_IDENTITY: ${{ vars.SAYSO_SIGN_IDENTITY }}
        run: |
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          [[ -n "$SIGN_IDENTITY" ]] && export SAYSO_SIGN_IDENTITY="$SIGN_IDENTITY"
          scripts/release.sh

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.dmg dist/*.dmg.sha256 --clobber

      - name: Keep the files for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

      - name: Delete the keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  # The Linux files come from the Linux packages workflow (linux.yml), which
  # does not touch the release. The manifest job attaches its files.
  linux-check:
    name: Linux (check the release)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Stop when users already get this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]]; then
            echo "::error::The release $TAG is not a prerelease, so users already get it. This workflow does not change it. Make a new version."
            exit 1
          fi

      - name: Check the tag against the version in Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::The tag is $TAG, but Cargo.toml has version $version. The tag must be v$version."
            exit 1
          fi

  linux:
    name: Linux
    needs: linux-check
    uses: ./.github/workflows/linux.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      official_build: true

  windows:
    name: Windows (x64)
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      # Each job reads the live state, so a new run and a rerun of one job obey it.
      - name: Stop when users already get this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((gh release view $env:TAG --json isPrerelease --jq .isPrerelease) -ne 'true') {
            Write-Output "::error::The release $env:TAG is not a prerelease, so users already get it. This workflow does not change it. Make a new version."
            exit 1
          }

      - name: Check the tag against the version in Cargo.toml
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$version") {
            Write-Output "::error::The tag is $env:TAG, but Cargo.toml has version $version. The tag must be v$version."
            exit 1
          }

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            native/portable

      # whisper.cpp in the speech engine builds with CMake, and its bindings need
      # libclang (the runner has LLVM). Inno Setup makes the installer.
      - name: Install CMake and Inno Setup
        run: |
          choco install cmake innosetup --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Write the signing certificate
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          # Optional: without the secret the build is not signed, and SmartScreen warns.
          if ($env:WINDOWS_CERTIFICATE_PFX) {
            $path = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
            "SAYSO_SIGN_CERT=$path" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          } else {
            Write-Output "::warning::WINDOWS_CERTIFICATE_PFX is not set, so the Windows build is not signed. See docs/releasing.md."
          }

      - name: Build the app and the installer
        env:
          SAYSO_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: scripts\bundle-windows.ps1 -Installer

      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-ChildItem dist\*-setup.exe, dist\*-setup.exe.sha256).FullName --clobber

      - name: Keep the files for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Delete the certificate
        if: always()
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'certificate.pfx')

  # Sign the update manifest and make the release the latest release. This job
  # takes the files from the builds of this run, not from the release, so a
  # changed release file never gets a signature.
  manifest:
    name: Update manifest
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    # One promotion at a time, for all tags.
    concurrency:
      group: release-promote
      cancel-in-progress: false
    env:
      # The id of the signing key in crates/sayso-update/src/keys.rs.
      SAYSO_UPDATE_KEY_ID: "2026-10"
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Stop when users already get this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]]; then
            echo "::error::The release $TAG is not a prerelease, so users already get it. This workflow does not change it. Make a new version."
            exit 1
          fi

      - name: Get the files of this run
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Write the payload
        run: |
          version="${TAG#v}"
          python3 - "$version" <<'PY'
          import hashlib, json, os, sys, datetime
          version = sys.argv[1]
          tag = os.environ["TAG"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases"
          files = {
              "macos-aarch64": f"Sayso-{version}-macos-arm64.dmg",
              "windows-x86_64": f"Sayso-{version}-windows-x64-setup.exe",
              "linux-x86_64": f"sayso-{version}-linux-x86_64.tar.gz",
              "linux-aarch64": f"sayso-{version}-linux-aarch64.tar.gz",
          }
          # The Linux packages are not in the manifest: Linux has no installer
          # in the app. They must be there, so a release always has each format.
          packages = [
              f"sayso-{version}-linux-{arch}.{ext}"
              for arch in ("x86_64", "aarch64")
              for ext in ("deb", "rpm", "AppImage", "flatpak")
          ]
          missing = [name for name in [*files.values(), *packages] if not os.path.isfile(os.path.join("dist", name))]
          if missing:
              sys.exit(f"::error::These release files are missing: {', '.join(missing)}")
          assets = {}
          for platform, name in files.items():
              path = os.path.join("dist", name)
              digest = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      digest.update(block)
              assets[platform] = {"url": f"{base}/download/{tag}/{name}", "sha256": digest.hexdigest(), "size": os.path.getsize(path)}
          payload = {
              "schema": 1,
              "version": version,
              "published": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "notes_url": f"{base}/tag/{tag}",
              "assets": assets,
          }
          with open("payload.json", "w") as f:
              json.dump(payload, f, separators=(",", ":"))
          print(json.dumps(payload, indent=2))
          PY

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Sign the manifest
        env:
          SAYSO_UPDATE_SIGNING_KEY: ${{ secrets.SAYSO_UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$SAYSO_UPDATE_SIGNING_KEY" ]]; then
            echo "::error::The secret SAYSO_UPDATE_SIGNING_KEY is not set. See docs/releasing.md."
            exit 1
          fi
          cargo run --quiet -p sayso-update --example update_tool -- sign "$SAYSO_UPDATE_KEY_ID" payload.json > latest.json
          # The app of this tag must accept the manifest with its own key list.
          cargo run --quiet -p sayso-update --example update_tool -- verify latest.json

      # The AUR package downloads the tarballs of the release, so its hashes
      # come from the files that the next step attaches. The files stay in the
      # run: nothing publishes them to the AUR yet.
      - name: Make the AUR files
        run: scripts/aur-pkgbuild.sh dist aur

      - name: Keep the AUR files
        uses: actions/upload-artifact@v4
        with:
          name: aur-sayso-bin
          path: aur
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true

      # The release gets the files that the manifest names, also when another
      # run for this tag attached other files in the meantime.
      - name: Attach the files of this run and the manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done
          gh release upload "$TAG" ./* ../latest.json --clobber

      # From here on, the updater of each installed Sayso sees this release.
      - name: Make the release the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No latest release is HTTP 404. Any other failure stops the job:
          # without the latest release, the version rule cannot be checked.
          if latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>lookup.err); then
            :
          elif grep -q "HTTP 404" lookup.err; then
            latest=""
          else
            echo "::error::Could not read the latest release: $(cat lookup.err)"
            exit 1
          fi
          newest=$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -1)
          if [[ -z "$latest" || ( "$newest" == "${TAG#v}" && "$latest" != "$TAG" ) ]]; then
            gh release edit "$TAG" --prerelease=false --latest
          else
            echo "::warning::The latest release is $latest, which is not older than $TAG. $TAG becomes a normal release, and $latest stays the latest release."
            gh release edit "$TAG" --prerelease=false --latest=false
          fi

  # Publish the Homebrew cask to watzon/homebrew-tap. This job runs after the
  # release is the latest release, so a failure here does not change the
  # release. To publish again, run this job again.
  homebrew:
    name: Homebrew cask
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One push to the tap at a time, for all tags.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      # The DMG of this run is the file that the manifest job attached.
      - name: Get the DMG of this run
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist

      - name: Make the cask
        run: scripts/homebrew-cask.sh dist/Sayso-*-macos-arm64.dmg cask/sayso.rb

      - name: Push the cask to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          # A deploy key of watzon/homebrew-tap with write access. See docs/releasing.md.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [[ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            echo "::error::The secret HOMEBREW_TAP_DEPLOY_KEY is not set. See docs/releasing.md."
            exit 1
          fi
          version="${TAG#v}"
          umask 077
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$RUNNER_TEMP/tap-key"
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > "$RUNNER_TEMP/tap-known-hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/tap-known-hosts"
          trap 'rm -f "$RUNNER_TEMP/tap-key"' EXIT

          # Another project can push to the tap at the same time, so try again with a new clone.
          for attempt in 1 2 3; do
            rm -rf tap
            git clone --depth 1 git@github.com:watzon/homebrew-tap.git tap
            current=$(sed -n 's/^ *version "\(.*\)"$/\1/p' tap/Casks/sayso.rb 2>/dev/null || true)
            if [[ -n "$current" && "$current" != "$version" && "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" == "$current" ]]; then
              echo "::warning::The tap has Sayso $current, which is newer than $version. The cask stays as it is."
              exit 0
            fi
            mkdir -p tap/Casks
            cp cask/sayso.rb tap/Casks/sayso.rb
            git -C tap add Casks/sayso.rb
            if git -C tap diff --cached --quiet; then
              echo "The tap already has Sayso $version."
              exit 0
            fi
            git -C tap -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "sayso $version"
            if git -C tap push origin HEAD; then
              echo "The tap has Sayso $version."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the cask to the tap."
          exit 1
