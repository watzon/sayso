name: Linux packages

# Build the three Linux binaries one time for each architecture, then make each
# package from that build: the tarball, the .deb, the .rpm, the AppImage, and
# the Flatpak. The engine release file (sayso-engine-<version>-linux-<arch>.tar.gz)
# comes from the same build, with the engine of the tarball.
# The files stay in the workflow run as artifacts. The Release workflow calls
# this workflow and attaches the files to the release.
#
# A pull request that changes the packaging runs it as a test. To run it by
# hand: gh workflow run linux.yml --ref <branch>
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, branch, or tag to build'
        required: true
        type: string
      official_build:
        description: 'Turn the updater on in the app (internal/update)'
        required: false
        default: false
        type: boolean
      skip_packages:
        description: 'Make only the tarball and the engine release file (the manual CI workflow checks the engine file and needs no package)'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux.yml'
      - 'packaging/linux/**'
      - 'scripts/bundle-linux.sh'
      - 'scripts/llama-libs/**'
      - 'scripts/engine-libs/**'
      - 'scripts/build-parakeet.sh'
      - 'scripts/test-llama-cpus.sh'
      - 'scripts/tiny-gguf.py'
      - 'scripts/package-linux.sh'
      - 'scripts/package-engine.sh'
      - 'packaging/engine/**'
      - 'scripts/linux-deps.sh'
      - 'scripts/linux-vulkan-deps.sh'

permissions:
  contents: read

concurrency:
  group: linux-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ubuntu 22.04 has the oldest glibc (2.35) that Sayso supports. A binary
  # runs on the glibc of its build system and on newer ones, so the build and
  # the start test use that system. docs/linux.md lists the distributions.
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 90
    env:
      SAYSO_OFFICIAL_BUILD: ${{ inputs.official_build && '1' || '' }}
      # The TelemetryDeck App ID (a repository variable) goes only into a release.
      SAYSO_TELEMETRY_APP_ID: ${{ inputs.official_build && vars.SAYSO_TELEMETRY_APP_ID || '' }}
      # The Vulkan headers and glslc of scripts/linux-vulkan-deps.sh. CMake's
      # FindVulkan and ggml look in VULKAN_SDK first.
      VULKAN_SDK: /opt/vulkan-deps
    steps:
      # The container has no tools. git lets the checkout keep the repository.
      - name: Install the base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git python3

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install the build packages
        run: DEBIAN_FRONTEND=noninteractive scripts/linux-deps.sh

      # Ubuntu 22.04 has no glslc package, and its Vulkan headers are too old
      # for ggml's Vulkan backend. The script pins the versions, so a change
      # to it makes a new key. glslc runs only on the architecture it was
      # built on.
      - name: Get the Vulkan headers and glslc from the cache
        id: vulkan-deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VULKAN_SDK }}
          key: vulkan-deps-ubuntu22.04-${{ matrix.arch }}-${{ hashFiles('scripts/linux-vulkan-deps.sh') }}

      - name: Build the Vulkan headers and glslc
        if: steps.vulkan-deps.outputs.cache-hit != 'true'
        run: scripts/linux-vulkan-deps.sh "$VULKAN_SDK"

      # Save now, not at the end of the job, so a failed build keeps it.
      - name: Keep the Vulkan headers and glslc in the cache
        if: steps.vulkan-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VULKAN_SDK }}
          key: ${{ steps.vulkan-deps.outputs.cache-primary-key }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The libraries that the speech engine loads: sherpa-onnx and ONNX
      # Runtime from pinned archives, and libparakeet.so built from pinned
      # sources with ggml's Vulkan backend (the reason for the steps above).
      - name: Get the speech engine libraries
        shell: bash
        run: |
          libs="$PWD/build/native-libs"
          prebuilt=$(go run ./scripts/engine-libs fetch -out build/engine-libs)
          mkdir -p "$libs"
          cp "$prebuilt"/* "$libs/"
          scripts/build-parakeet.sh "$libs"
          echo "SAYSO_NATIVE_LIBS_DIR=$libs" >> "$GITHUB_ENV"

      - name: Build the tarball
        run: SAYSO_BUNDLE_DIR=dist scripts/bundle-linux.sh

      - name: Keep the tarball for the package job
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

      # The engine of the tarball, not a new build. The file goes to its own
      # folder, so the artifact above and the package job never see it.
      # The Release workflow attaches it to the release in the manifest job,
      # like the tarball. The file name has arm64 where the tarball has aarch64.
      - name: Make the engine release file
        shell: bash
        run: scripts/package-engine.sh --out engine dist/sayso-*-linux-*/bin/sayso-engine

      - name: Keep the engine release file
        uses: actions/upload-artifact@v4
        with:
          name: release-engine-linux-${{ matrix.arch == 'aarch64' && 'arm64' || matrix.arch }}
          path: engine/*.tar.gz
          if-no-files-found: error
          overwrite: true

  # No compiler here: each package gets the binaries of the tarball.
  package:
    name: Packages (${{ matrix.arch }})
    needs: build
    if: ${{ inputs.skip_packages != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 20
    steps:
      - name: Install the base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git binutils file flatpak
          # The AppImage holds a copy of the libraries of appimage_fallback_libs (scripts/package-linux.sh).
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libasound2 libxcb1 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Get the tarball
        uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist

      - name: Make the .deb, the .rpm, the AppImage, and the Flatpak
        shell: bash
        run: scripts/package-linux.sh dist/sayso-*-linux-${{ matrix.arch }}.tar.gz

      # Install the .deb with its dependencies and verify the installed app
      # (headless smoke render of all UI surfaces) and speech engine handshake.
      - name: Start the installed app
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/sayso-*-linux-${{ matrix.arch }}.deb
          sayso --version
          smoke=$(SAYSO_SMOKE=1 sayso)
          echo "$smoke"
          grep -qE 'smoke: [0-9]+ renders ok' <<< "$smoke" || { echo "::error::Sayso smoke render did not report ok."; exit 1; }
          mkdir -p "$RUNNER_TEMP/models"
          reply=$(printf '{"v":1,"id":"1","type":"hello"}\n' | SAYSO_MODELS_DIR="$RUNNER_TEMP/models" timeout 20 /usr/lib/sayso/sayso-engine)
          echo "$reply"
          [[ "$reply" == *'"type":"hello"'* ]] || { echo "::error::sayso-engine gave no hello reply."; exit 1; }
          # The speech libraries beside the engine, and every library they need.
          for lib in libsherpa-onnx-c-api.so libonnxruntime.so libparakeet.so; do
            [[ -f "/usr/lib/sayso/$lib" ]] || { echo "::error::The package has no $lib."; exit 1; }
          done
          deps=$(ldd /usr/lib/sayso/*.so)
          echo "$deps"
          if grep -q 'not found' <<< "$deps"; then echo "::error::A speech library misses a library."; exit 1; fi
      # The cleanup runtime needs no model to answer hello, and its backend
      # is the CPU on Linux. Its llama.cpp libraries are in /usr/lib/sayso/llama
      # with libgomp, and libffi comes from the libffi8 dependency.
      - name: Start the installed cleanup runtime
        shell: bash
        run: |
          llama=/usr/lib/sayso/llama
          ldd "$llama/sayso-cleanup"
          deps=$(ldd "$llama/libllama.so" "$llama/libggml-base.so")
          echo "$deps"
          if grep -q 'not found' <<< "$deps" || ! grep -q "libgomp.so.1 => $llama/libgomp.so.1" <<< "$deps"; then
            echo "::error::The llama.cpp libraries miss a library, or do not take libgomp from $llama."
            exit 1
          fi
          reply=$(printf '{"v":1,"id":"1","type":"hello"}\n' | timeout 20 "$llama/sayso-cleanup")
          echo "$reply"
          [[ "$reply" == *'"type":"hello"'* && "$reply" == *'"backend":"cpu"'* && "$reply" == *'"libraries":"found"'* ]] || { echo "::error::The cleanup runtime gave no hello with the cpu backend and its libraries."; exit 1; }

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.flatpak
          if-no-files-found: error
          overwrite: true

  # The x86_64 cleanup runtime loads a model and completes text on older
  # processors under QEMU, down to x86-64 with no SSE 4.2: ggml loads the CPU
  # library that the processor runs (issue #37). This job runs on Ubuntu
  # 24.04 for its QEMU 8.2: QEMU emulates AVX and AVX2 from 7.2 on. The
  # binaries of the tarball, built on 22.04, run on the newer glibc.
  cleanup-cpus:
    name: Cleanup runtime on older processors
    needs: build
    if: ${{ inputs.skip_packages != true }}
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Install the tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv qemu-user libffi8 libstdc++6

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Get the tarball
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist

      - name: Run the cleanup runtime on older processors
        shell: bash
        run: |
          qemu-x86_64 --version
          tar -xzf dist/sayso-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet gguf==0.19.0 numpy
          "$RUNNER_TEMP/venv/bin/python" scripts/tiny-gguf.py "$RUNNER_TEMP/tiny.gguf"
          scripts/test-llama-cpus.sh "$RUNNER_TEMP"/sayso-*-linux-x86_64/bin/llama "$RUNNER_TEMP/tiny.gguf"
