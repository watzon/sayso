name: Linux packages

# Build the two Linux binaries one time for each architecture, then make each
# package from that build: the tarball, the .deb, the .rpm, and the AppImage.
# The files stay in the workflow run as artifacts. The Release workflow calls
# this workflow and attaches the files to the release.
#
# A pull request that changes the packaging runs it as a test. To run it by
# hand: gh workflow run linux.yml --ref <branch>
on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit, branch, or tag to build'
        required: true
        type: string
      official_build:
        description: 'Turn the updater on in the app (sayso-update, official_build)'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/linux.yml'
      - 'packaging/linux/**'
      - 'scripts/bundle-linux.sh'
      - 'scripts/package-linux.sh'
      - 'scripts/linux-deps.sh'

permissions:
  contents: read

concurrency:
  group: linux-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Ubuntu 22.04 has the oldest glibc (2.35) that Sayso supports. A binary
  # runs on the glibc of its build system and on newer ones, so the build and
  # the start test use that system. docs/linux.md lists the distributions.
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 90
    env:
      SAYSO_OFFICIAL_BUILD: ${{ inputs.official_build && '1' || '' }}
    steps:
      # The container has no tools. git lets the checkout keep the repository.
      - name: Install the base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git python3

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install the build packages
        run: DEBIAN_FRONTEND=noninteractive scripts/linux-deps.sh

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install

      - uses: Swatinem/rust-cache@v2

      # sherpa-onnx-sys downloads its native library to target/sherpa-onnx-prebuilt
      # and links from there. The cache keeps the folders in that path, but
      # deletes the files in them, and the build script does not download when
      # the lib folder is there. When no library file is there, remove the
      # folder and clean the crate, so the build script downloads again.
      # Without this, a change to Cargo.lock fails with "could not find native
      # static library sherpa-onnx-c-api".
      - name: Get the sherpa-onnx library again when the cache does not have it
        shell: bash
        run: |
          libs=$(find target/sherpa-onnx-prebuilt -type f \( -name '*.a' -o -name '*.lib' \) 2>/dev/null | head -n 1 || true)
          if [[ -z "$libs" ]]; then
            rm -rf target/sherpa-onnx-prebuilt
            cargo clean -p sherpa-onnx-sys
            cargo clean -p sherpa-onnx-sys --release
          fi

      - name: Build the tarball
        run: SAYSO_BUNDLE_DIR=dist scripts/bundle-linux.sh

      - name: Keep the tarball for the package job
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  # No compiler here: each package gets the binaries of the tarball.
  package:
    name: Packages (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 20
    steps:
      - name: Install the base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git binutils file

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Get the tarball
        uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist

      - name: Make the .deb, the .rpm, and the AppImage
        shell: bash
        run: scripts/package-linux.sh dist/sayso-*-linux-${{ matrix.arch }}.tar.gz

      # Install the .deb with its dependencies and start Sayso on a virtual
      # display. The app does not stop by itself, so the timeout stops it (124).
      - name: Start the installed app
        shell: bash
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/sayso-*-linux-${{ matrix.arch }}.deb xvfb xauth dbus mesa-vulkan-drivers
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          status=0
          timeout 30 dbus-run-session -- xvfb-run -a sayso || status=$?
          log="$XDG_CACHE_HOME/sayso/logs/sayso.log"
          cat "$log"
          [[ $status -eq 124 ]] || { echo "::error::Sayso stopped with status $status before the timeout."; exit 1; }
          for text in 'sayso-engine .* ready' 'Selected GPU adapter' 'chords use'; do
            grep -qE "$text" "$log" || { echo "::error::The log does not have \"$text\"."; exit 1; }
          done

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
          overwrite: true
