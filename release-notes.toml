# The notes that Sayso shows one time after an update, in the "What is new"
# window. docs/releasing.md says how to add a release.
#
# Newest release first. A release without an entry here shows no window.
#
#   [[release]]
#   version = "1.2.3"            # The version in Cargo.toml.
#   title = "One short line"     # The headline of the window.
#
#   [[release.item]]             # One new feature. Keep to five or fewer.
#   icon = "sparkle"             # A name from `icon` in crates/sayso-app/src/whats_new.rs.
#   title = "The feature"
#   text = "One or two sentences."
#   systems = ["macos"]          # Optional: "macos", "windows", "linux". Without it, all systems.
#
#   [release.note]               # Optional: an announcement or a request, above the footer.
#   title = "The note"
#   text = "One or two sentences."
#   action = "The button"
#   url = "https://…"

[[release]]
version = "0.14.0"
title = "Connect your own apps to Sayso"

[[release.item]]
icon = "shield"
title = "Connected apps"
text = "Other apps can now use Sayso for speech, once you allow them. Sayso asks one time for each app, and you can take the permission back in Settings › Connected apps."

[[release.item]]
icon = "download"
title = "A new place for your models"
text = "Sayso moves your models to a new folder at the first start, with no download. If you go back to an older version, it downloads the models again."

[[release]]
version = "0.12.0"
title = "One speech engine for Windows and Linux"

[[release.item]]
icon = "overlay"
title = "Live preview with Parakeet on Linux"
text = "Parakeet TDT v3 now shows the live preview while you dictate on Linux, in each of its languages."
systems = ["linux"]

[[release.item]]
icon = "download"
title = "A new speech engine on Windows"
text = "Windows now uses the speech engine of Linux. Sayso downloads your Parakeet models again one time, because the new engine reads other files. Whisper models stay as they are."
systems = ["windows"]

[[release]]
version = "0.11.0"
title = "Clean up text on this computer"

[[release.item]]
icon = "styles"
title = "Local cleanup models"
text = "S1-mini by Superwhisper and Cleanup 1 by Spokenly clean up your dictation on this computer, with no cloud provider. S1-mini is for English. Cleanup 1 has seven languages and three tones. Add one in Settings › Providers."

[[release.item]]
icon = "keyboard"
title = "Dictate with a modifier key"
text = "A shortcut can now be one modifier key, for example a modifier on the right side of the keyboard, or a set of modifiers. Set it in Settings › Dictation."

[[release.item]]
icon = "models"
title = "Fluid Speech Mini on the GPU"
text = "On Linux, Fluid Speech Mini now runs on the GPU through Vulkan. The Vulkan loader must be installed."
systems = ["linux"]

[[release.item]]
icon = "mic"
title = "A faster start"
text = "The overlay opens as soon as you start a dictation, and the microphone opens before the live preview. Sayso also starts without a wait for the speech engine."

[[release]]
version = "0.10.0"
title = "A notch for your dictation"

[[release.item]]
icon = "overlay"
title = "The notch overlay"
text = "A black notch opens from the top of the display while you dictate, with the live preview below it. On a Mac with a camera notch, it fits that notch. Choose it in Settings › Overlay."

[[release.item]]
icon = "globe"
title = "Five more languages"
text = "Sayso now speaks German, French, Italian, Korean, and Russian. Numbers use the separators of your interface language."

[[release.item]]
icon = "keyboard"
title = "Esc stays with Sayso"
text = "The Esc that cancels a dictation no longer reaches the app you are in. Turn it off in Settings › Dictation."
systems = ["macos", "windows"]

[[release.item]]
icon = "sparkle"
title = "Works with screen readers"
text = "Every window now has names and roles for VoiceOver, Narrator, Orca, and other assistive tools. The overlay announces each change of the dictation state."

[[release.item]]
icon = "mic"
title = "Clear microphone errors"
text = "When the microphone does not start or disconnects, the overlay tells you why, instead of \"No speech\"."

[[release]]
version = "0.9.0"
title = "Pick the right model"

[[release.item]]
icon = "models"
title = "Measured accuracy and speed"
text = "The Models page shows accuracy that Sayso measured on 1400 English clips, with the builds that it ships. On a Mac it also shows the speed. Search and sort the lists, and open a model for its details."

[[release.item]]
icon = "overlay"
title = "Choose the live preview model"
text = "Choose one model for the final text and one for the live preview, or turn the preview off. Each streaming model can also write the final text."

[[release.item]]
icon = "keyboard"
title = "Send with Enter"
text = "Press Enter while you dictate to insert the text and send it, for chats and terminals. Turn it on in Settings › Dictation."
systems = ["macos", "windows"]

[[release.item]]
icon = "download"
title = "Fluid Speech Mini"
text = "A small, fast English model (253 MB) by FluidVoice, for macOS 15 and later."
systems = ["macos"]

[[release.item]]
icon = "mic"
title = "Fewer empty dictations"
text = "Whisper, SenseVoice, Nemotron, and Parakeet EOU now give text for short dictations. SenseVoice needs a new download (941 MB)."
systems = ["macos"]

[[release]]
version = "0.8.0"
title = "Sayso speaks your language"

[[release.item]]
icon = "globe"
title = "Four new languages"
text = "The whole app is now in Spanish, Brazilian Portuguese, Simplified Chinese, and Japanese. Sayso follows your system. To choose another language, go to Settings › General."

[[release.item]]
icon = "sparkle"
title = "The Rambling style"
text = "Speak a long thought as it comes. Rambling joins the points that you repeat, drops the thoughts that you leave, and makes clear sentences, in your own words."

[[release.item]]
icon = "audio"
title = "Pause media while you dictate"
text = "Sayso can pause your music and videos when you start to dictate, and play them again when you stop. Turn on Pause media in Settings › Audio."

[[release.item]]
icon = "settings"
title = "A thinking level for each provider"
text = "Choose how much the model thinks before it answers, on each provider in Settings: Claude CLI, Codex CLI, and OpenRouter."

[[release.item]]
icon = "code"
title = "Copy metadata from History"
text = "When a dictation is slow, choose Copy metadata in its menu in History and add it to a bug report. Your text is not in it."

[[release]]
version = "0.7.1"
title = "Styles keep your words"

[[release.item]]
icon = "styles"
title = "Your words stay"
text = "The built-in styles no longer put a different word in place of yours. Slang and contractions stay, and Message, Email, and Notes change the layout, not your voice. If you changed a style or the base prompt, reset it on the Styles page to get this."

[[release]]
version = "0.7.0"
title = "History shows the site, and the pill goes to the top"

[[release.item]]
icon = "history"
title = "Site icons in History"
text = "A dictation into a web page shows the icon of the site on the app icon. You can turn it off in Settings, History and privacy."
systems = ["macos", "windows"]

[[release.item]]
icon = "overlay"
title = "The pill at the top of the screen"
text = "Drag the pill to the top edge of a display. The live preview then shows below it."

[[release.item]]
icon = "models"
title = "Load the model later"
text = "Sayso can load the speech model at the first dictation and not at the start, and uses less memory until then. Turn off \"Load the model when Sayso starts\" in Settings, Advanced."

[[release.item]]
icon = "download"
title = "An AppImage for more systems"
text = "The AppImage now starts on a system that does not have libxkbcommon-x11."
systems = ["linux"]

[[release]]
version = "0.6.0"
title = "The right style for each app"

[[release.item]]
icon = "styles"
title = "Style rules"
text = "Give an app its own style, for example Message in Slack and Email in Mail. On macOS and Windows, a site in a browser can have one too. Turn the rules on in Settings, Dictation."

[[release.item]]
icon = "sparkle"
title = "Better cleanup in all styles"
text = "All styles now share one base prompt for filler words, self-corrections, numbers, and spelled words. You can edit it on the Styles page."

[[release.item]]
icon = "keyboard"
title = "Spoken punctuation"
text = "Say \"comma\", \"question mark\", or \"new line\" in English, and Sayso writes the mark. Turn it on in Settings, Dictation."

[[release.item]]
icon = "mic"
title = "A space after each dictation"
text = "Sayso adds a space after the text that it inserts, so two dictations in a row do not join. You can turn it off in Settings, Dictation."

[[release]]
version = "0.5.0"
title = "More control over what Sayso keeps"

[[release.item]]
icon = "sparkle"
title = "Apple Intelligence styles"
text = "A style can use the language model of macOS 26. The transcript stays on your Mac, and there is no download."
systems = ["macos"]

[[release.item]]
icon = "lock"
title = "Incognito"
text = "Turn on Incognito, and Sayso stores no history entry until you turn it off or quit Sayso."

[[release.item]]
icon = "history"
title = "History controls"
text = "Turn history off, delete the text and the audio separately, and see how much disk space they use."

[[release.item]]
icon = "search"
title = "Search in the app filter"
text = "Type to find an app in the filter of History, and use the arrow keys to select it."

[release.note]
title = "Sayso is pay what you want"
text = "If Sayso is useful to you, support its development. Each build is the full app."
action = "Support Sayso"
url = "https://github.com/sponsors/watzon"
