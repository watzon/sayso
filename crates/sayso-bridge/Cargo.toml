[package]
name = "sayso-bridge"
description = "The checks of the host that also run outside the Flatpak sandbox: who wrote each read, the identity of a process, and the program that relays apps to a Sayso in a Flatpak. It links only libc, so it runs on any Linux."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sayso-bridge"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
