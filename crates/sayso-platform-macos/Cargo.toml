[package]
name = "sayso-platform-macos"
description = "macOS implementations of the Sayso platform traits."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The crate is empty on other systems, so `cargo test --workspace` works everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
sayso-core.workspace = true
sayso-platform.workspace = true
sayso-platform-common.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
serde_json.workspace = true

global-hotkey = "0.8"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3.2"
objc2-service-management = "0.3.2"
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dev-dependencies]
env_logger.workspace = true
