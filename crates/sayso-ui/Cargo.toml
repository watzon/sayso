[package]
name = "sayso-ui"
description = "Sayso's tactile paper design system on GPUI and gpui-kit."
version.workspace = true
edition.workspace = true
# The workspace license is GPL-3.0-only. This crate is MIT (docs/adr/0002-mit-sdk-gpl-app.md).
# The bundled fonts keep their own OFL licenses (assets/fonts/licenses).
license = "MIT"
publish = true
repository = "https://github.com/watzon/sayso"

[dependencies]
sayso-ink.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
rust-embed = { version = "8", features = ["include-exclude"] }
workspace-hack.workspace = true
