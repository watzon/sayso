[package]
name = "sayso-engine-client"
description = "Rust client for the SaysoEngine speech sidecar. Implements SttBackend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# A scripted engine that speaks the NDJSON protocol. The tests spawn it instead of the real sidecar.
name = "sayso-fake-engine"
path = "src/bin/fake_engine.rs"
test = false

[dependencies]
sayso-core.workspace = true
sayso-platform.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
log.workspace = true
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
