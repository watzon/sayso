[package]
name = "sayso-extension"
description = "The client of the Sayso Host API: connect to Sayso, send requests, and get events. Blocking calls, no async runtime."
version.workspace = true
edition.workspace = true
# The workspace license is GPL-3.0-only. This crate is MIT (docs/adr/0002-mit-sdk-gpl-app.md).
license = "MIT"
publish = true
repository = "https://github.com/watzon/sayso"

[dependencies]
sayso-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
workspace-hack.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
