_version: 1

# The question that an extension asks before it downloads a model.
extensions:
  download_ask:
    window_title: "Scarica un modello"
    title: "%{extension} vuole scaricare un modello"
    body: "Se accetti, Sayso scarica %{model} (%{size}) su questo computer."
    reason_label: "Motivo indicato da %{extension}"
    download: "Scarica"
    cancel: "Annulla"
  # The question before Sayso quits while an extension records or transcribes.
  quit_ask:
    window_title: "Esci da Sayso"
    recording: "%{extension} sta registrando. Uscire comunque?"
    transcribing: "%{extension} sta trascrivendo un file. Uscire comunque?"
    body: "Se esci, questo lavoro si interrompe e l’estensione non può completarlo."
    others_label: "Altre estensioni al lavoro ora"
    cancel: "Annulla"
    quit: "Esci"
