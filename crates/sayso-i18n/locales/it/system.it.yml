_version: 1

# Text in files that the system shows, outside the app: the macOS prompt for
# the microphone, the Linux desktop entry, and the Linux app store entry.
# scripts/i18n-system-files.py writes these files from this catalog.
system:
  microphone_usage: "Sayso ascolta il microfono solo mentre detti. Il parlato viene trascritto su questo Mac."
  system_audio_usage: "Sayso registra l’audio di altre app e chiamate solo per un’app che hai autorizzato, mentre quell’app registra."
  generic_name: "Dettatura vocale"
  comment: "Parla e Sayso scrive il testo nell'app che usi"
  # Search words, separated by ";", with a ";" at the end. Keep "whisper"
  # and "parakeet" (model names) and add words people use in the language.
  keywords: "dettatura;dettare;voce;trascrizione;riconoscimento vocale;speech to text;whisper;parakeet;"
  toggle_action: "Avvia o ferma la dettatura"
  summary: "Dettatura vocale locale in qualsiasi app"
  description: "Premi un tasto, parla e Sayso scrive il testo nell'app che usi. Il riconoscimento vocale funziona sul tuo computer. Nulla lo lascia, a meno che tu scelga un modello cloud o uno stile IA con un provider cloud."
