_version: 1

# The question that an extension asks before it downloads a model.
extensions:
  download_ask:
    window_title: "Descargar un modelo"
    title: "%{extension} quiere descargar un modelo"
    body: "Si aceptas, Sayso descarga %{model} (%{size}) en este ordenador."
    reason_label: "Motivo de %{extension}"
    download: "Descargar"
    cancel: "Cancelar"
  # The question before Sayso quits while an extension records or transcribes.
  quit_ask:
    window_title: "Salir de Sayso"
    recording: "%{extension} está grabando. ¿Salir de todos modos?"
    transcribing: "%{extension} está transcribiendo un archivo. ¿Salir de todos modos?"
    body: "Si sales, este trabajo se detiene y la extensión no puede terminarlo."
    others_label: "Otras extensiones que trabajan ahora"
    cancel: "Cancelar"
    quit: "Salir"
