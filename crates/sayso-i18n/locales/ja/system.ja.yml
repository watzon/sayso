_version: 1

# Text in files that the system shows, outside the app: the macOS prompt for
# the microphone, the Linux desktop entry, and the Linux app store entry.
# scripts/i18n-system-files.py writes these files from this catalog.
system:
  microphone_usage: "Sayso は音声入力中だけマイクを使用します。音声はこの Mac 上で文字起こしされます。"
  system_audio_usage: "Sayso は、許可したアプリが録音している間だけ、そのアプリのためにほかのアプリや通話の音声を録音します。"
  generic_name: "音声入力"
  comment: "話すと、使用中のアプリに Sayso がテキストを書き込みます"
  # Search words, separated by ";", with a ";" at the end. Keep "whisper"
  # and "parakeet" (model names) and add words people use in the language.
  keywords: "音声入力;音声認識;文字起こし;ディクテーション;書き起こし;whisper;parakeet;"
  toggle_action: "音声入力の開始/停止"
  summary: "どのアプリにも使えるローカル音声入力"
  description: "キーを押して話すと、使用中のアプリに Sayso がテキストを書き込みます。音声認識はコンピュータ上で実行されます。クラウドモデルや、クラウドプロバイダを使う AI スタイルを選択しない限り、データが外部に送信されることはありません。"
