    download: "Sayso はアップデートをダウンロードできませんでした：%{error}。接続を確認してから、もう一度お試しください。"
    prepare: "Sayso はアップデートを準備できませんでした：%{error}。"
  tooltip: "%{headline}。%{label}"
  slip_title: "アップデートがあります"
  slip_version: "Sayso %{version}"
  slip_newer: "新しい Sayso"
  now_version: "Sayso は %{version} になりました"
  whats_new: "新機能"
  dismiss: "閉じる"
