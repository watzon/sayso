_version: 1

# The question that an extension asks before it downloads a model.
extensions:
  download_ask:
    window_title: "Modell herunterladen"
    title: "%{extension} möchte ein Modell herunterladen"
    body: "Wenn du zustimmst, lädt Sayso %{model} (%{size}) auf diesen Computer herunter."
    reason_label: "Grund von %{extension}"
    download: "Herunterladen"
    cancel: "Abbrechen"
  # The question before Sayso quits while an extension records or transcribes.
  quit_ask:
    window_title: "Sayso beenden"
    recording: "%{extension} nimmt gerade auf. Trotzdem beenden?"
    transcribing: "%{extension} transkribiert gerade eine Datei. Trotzdem beenden?"
    body: "Wenn du beendest, stoppt diese Arbeit, und die Erweiterung kann sie nicht abschließen."
    others_label: "Andere Erweiterungen, die gerade arbeiten"
    cancel: "Abbrechen"
    quit: "Beenden"
