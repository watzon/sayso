_version: 1

# Text in files that the system shows, outside the app: the macOS prompt for
# the microphone, the Linux desktop entry, and the Linux app store entry.
# scripts/i18n-system-files.py writes these files from this catalog.
system:
  microphone_usage: "Sayso hört nur zu, während du diktierst. Sprache wird auf diesem Mac transkribiert."
  system_audio_usage: "Sayso nimmt den Ton anderer Apps und Anrufe nur für eine von dir erlaubte App auf, solange diese App aufnimmt."
  generic_name: "Diktierprogramm"
  comment: "Sprich, und Sayso schreibt den Text in die App, die du nutzt"
  # Search words, separated by ";", with a ";" at the end. Keep "whisper"
  # and "parakeet" (model names) and add words people use in the language.
  keywords: "diktat;diktieren;sprache;spracheingabe;spracherkennung;sprachsteuerung;stimme;transkription;transkribieren;whisper;parakeet;"
  toggle_action: "Diktat starten oder stoppen"
  summary: "Lokales Diktieren in jede App"
  description: "Drücke eine Taste, sprich, und Sayso schreibt den Text in die App, die du nutzt. Die Spracherkennung läuft auf deinem Computer. Nichts verlässt ihn, es sei denn, du wählst ein Cloud-Modell oder einen KI-Stil mit einem Cloud-Anbieter."
