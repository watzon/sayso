_version: 1

# The update status in Settings › General, the Hub sidebar, and the popover.
# Text in "quotes" such as "flatpak install --user" is a command: keep it.
update:
  action:
    check: "Проверить обновления"
    update_now: "Обновить сейчас"
    show_in_finder: "Показать в Finder"
    how_to_update: "Как обновить"
    download: "Скачать"
    cancel: "Отмена"
    restart: "Перезапустить для обновления"
    open_download_page: "Открыть страницу загрузки"
    try_again: "Повторить"
    see_why: "Узнать причину"
  up_to_date: "Sayso обновлён"
  version: "Версия %{version}"
  never_checked: "Версия %{version}. Проверка ещё не выполнялась."
  last_check_unknown: "Версия %{version}. Время последней проверки неизвестно."
  last_check_today: "Версия %{version}. Последняя проверка сегодня в %{time}."
  last_check_date: "Версия %{version}. Последняя проверка %{date} в %{time}."
  checking: "Проверка обновлений…"
  available: "Доступен Sayso %{version}"
  you_have: "У вас версия %{version}."
  wrong_folder: "Sayso не может обновить себя из этой папки. Переместите Sayso в папку «Программы» и откройте снова."
  no_permission: "У вас версия %{version}. Sayso не может записывать в свою папку, поэтому не может обновить себя. Скачайте новую версию и установите её."
  no_exchange: "У вас версия %{version}. Диск Sayso не умеет заменять приложение за один шаг, поэтому Sayso не может обновить себя. Скачайте новую версию и установите её."
  unsupported: "У вас версия %{version}. Скачайте новую версию и установите её."
  packaged_appimage: "У вас версия %{version}. Скачайте новый AppImage и используйте его вместо этого."
  packaged_flatpak: "У вас версия %{version}. Скачайте новый файл Flatpak. Затем установите его так же, как устанавливали этот: \"flatpak install --user\" и файл, либо без \"--user\" для установки для всех пользователей."
  packaged_aur: "У вас версия %{version}. Обновите пакет AUR с помощью вашего помощника AUR, например \"yay -S sayso-bin\". Новая версия может появиться в пакете не сразу после выпуска."
  packaged_nix: "У вас версия %{version}. Получите новую версию через Nix. В системной конфигурации обновите входные данные flake для Sayso и пересоберите систему. С \"nix run\" добавьте \"--refresh\". Новая версия может появиться во flake не сразу после выпуска."
  downloading: "Загрузка Sayso %{version}"
  downloading_short: "Загрузка %{version}"
  downloaded: "%{received} из %{total}"
  megabytes: "%{number} МБ"
  preparing: "Подготовка Sayso %{version}…"
  preparing_short: "Подготовка %{version}…"
  preparing_detail: "Sayso распаковывает новую версию и проверяет её подпись."
  ready: "Sayso %{version} готов к установке"
  ready_short: "Sayso %{version} готов"
  ready_detail: "Sayso закроется и откроется снова. Это занимает несколько секунд."
  newer_available: "Доступна более новая версия Sayso"
  unreadable_detail: "Версия %{version} не может прочитать сведения об обновлении. Скачайте новую версию и установите её."
  failed: "Sayso не удалось обновиться"
