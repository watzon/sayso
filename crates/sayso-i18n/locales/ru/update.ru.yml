  failure:
    unknown: "Не удалось обновить."
    busy: "Из этого приложения запущен другой Sayso. Закройте его и повторите."
    cannot_update_itself: "Эта установка не может обновить себя."
    nothing_staged: "Нет подготовленного обновления для установки."
    not_installed: "Sayso не удалось установить обновление. У вас осталась прежняя версия."
    bad_signature: "В записи об обновлении нет подписи Sayso."
    moved: "Sayso переместили в другую папку после подготовки обновления."
    not_newer: "Подготовленное обновление не новее этой версии."
    staging_gone: "Подготовленное обновление исчезло."
    write_record: "Sayso не удалось записать данные об обновлении: %{error}."
    exchange: "Sayso не удалось заменить приложение: %{error}"
    relaunch: "Sayso не удалось запустить новую версию: %{error}. У вас осталась прежняя версия."
    relaunch_and_restore: "Sayso не удалось запустить новую версию: %{error}. Не удалось вернуть старую версию: %{back}. Установите Sayso заново со страницы загрузки."
    unreachable: "Sayso не удалось подключиться к серверу обновлений. Проверьте подключение и повторите попытку. (%{error})"
    check_failed: "Sayso не удалось получить сведения об обновлении: %{error}. Повторите позже."
    not_accepted: "Sayso не принял сведения об обновлении: %{error}."
    replayed: "Сервер обновлений предложил версию %{version}, которая старше версии, ранее известной Sayso. Повторите позже."
    mismatch: "Файл, который скачал Sayso, не совпадает с файлом выпуска. Повторите позже."
    disk: "Sayso не удалось записать файл: %{error}. Убедитесь, что на диске есть свободное место, и повторите попытку."
    download: "Sayso не удалось скачать обновление: %{error}. Проверьте подключение и повторите попытку."
    prepare: "Sayso не удалось подготовить обновление: %{error}."
  tooltip: "%{headline}. %{label}"
  slip_title: "Доступно обновление"
  slip_version: "Sayso %{version}"
  slip_newer: "Более новый Sayso"
  now_version: "Теперь Sayso %{version}"
  whats_new: "Что нового"
  dismiss: "Закрыть"
  # "Restart to update" while an extension records or transcribes.
  waits_for_extension: "Sayso перезапустится для обновления, когда %{extension} закончит работу."
