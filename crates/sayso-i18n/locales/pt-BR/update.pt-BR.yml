  ready: "O Sayso %{version} está pronto para instalar"
  ready_short: "O Sayso %{version} está pronto"
  ready_detail: "O Sayso fecha e abre de novo. Isso leva alguns segundos."
  newer_available: "Há um Sayso mais novo disponível"
  unreadable_detail: "A versão %{version} não consegue ler as informações da atualização. Baixe a nova versão e instale-a."
  failed: "O Sayso não conseguiu atualizar"
