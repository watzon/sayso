_version: 1

# The update status in Settings › General, the Hub sidebar, and the popover.
# Text in "quotes" such as "flatpak install --user" is a command: keep it.
update:
  action:
    check: "Buscar atualizações"
    update_now: "Atualizar agora"
    show_in_finder: "Mostrar no Finder"
    how_to_update: "Como atualizar"
    download: "Baixar"
    cancel: "Cancelar"
    restart: "Reiniciar para atualizar"
    open_download_page: "Abrir a página de download"
    try_again: "Tentar de novo"
    see_why: "Ver o motivo"
  up_to_date: "O Sayso está atualizado"
  version: "Versão %{version}"
  never_checked: "Versão %{version}. O Sayso ainda não buscou atualizações."
  last_check_unknown: "Versão %{version}. A última busca foi em um horário desconhecido."
  last_check_today: "Versão %{version}. Última busca hoje às %{time}."
  last_check_date: "Versão %{version}. Última busca em %{date} às %{time}."
  checking: "Buscando atualizações…"
  available: "O Sayso %{version} está disponível"
  you_have: "Você tem a %{version}."
  wrong_folder: "O Sayso não consegue se atualizar a partir desta pasta. Mova o Sayso para a pasta Aplicativos e abra-o de novo."
  no_permission: "Você tem a %{version}. O Sayso não pode escrever na própria pasta, então não consegue se atualizar. Baixe a nova versão e instale-a."
