  failure:
    unknown: "A atualização falhou."
    busy: "Outro Sayso está em execução a partir deste app. Feche-o e tente de novo."
    cannot_update_itself: "Esta instalação não consegue se atualizar."
    nothing_staged: "Nenhuma atualização está pronta para instalar."
    not_installed: "O Sayso não conseguiu instalar a atualização. Você continua com a versão anterior."
    bad_signature: "O registro da atualização não tem uma assinatura do Sayso."
    moved: "O Sayso foi movido para outra pasta depois que a atualização foi preparada."
    not_newer: "A atualização preparada não é mais nova que esta versão."
    staging_gone: "A atualização preparada não existe mais."
    write_record: "O Sayso não conseguiu gravar o registro da atualização: %{error}."
    exchange: "O Sayso não conseguiu substituir o app: %{error}"
    relaunch: "O Sayso não conseguiu abrir a nova versão: %{error}. Você continua com a versão anterior."
    relaunch_and_restore: "O Sayso não conseguiu abrir a nova versão: %{error}. Também não conseguiu restaurar a versão antiga: %{back}. Instale o Sayso de novo a partir da página de download."
    unreachable: "O Sayso não conseguiu acessar o servidor de atualizações. Verifique sua conexão e tente de novo. (%{error})"
    check_failed: "O Sayso não conseguiu obter as informações da atualização: %{error}. Tente de novo mais tarde."
    not_accepted: "O Sayso não aceitou as informações da atualização: %{error}."
    replayed: "O servidor de atualizações ofereceu a versão %{version}, que é mais antiga que uma versão vista antes pelo Sayso. Tente de novo mais tarde."
    mismatch: "O arquivo que o Sayso baixou não é o arquivo do lançamento. Tente de novo mais tarde."
    disk: "O Sayso não conseguiu gravar o arquivo: %{error}. Verifique se o disco tem espaço livre e tente de novo."
    download: "O Sayso não conseguiu baixar a atualização: %{error}. Verifique sua conexão e tente de novo."
    prepare: "O Sayso não conseguiu preparar a atualização: %{error}."
  tooltip: "%{headline}. %{label}"
  slip_title: "Atualização disponível"
  slip_version: "Sayso %{version}"
  slip_newer: "Um Sayso mais novo"
  now_version: "O Sayso agora é a %{version}"
  whats_new: "Novidades"
  dismiss: "Dispensar"
  # "Restart to update" while an extension records or transcribes.
  waits_for_extension: "O Sayso vai reiniciar para atualizar quando %{extension} terminar."
