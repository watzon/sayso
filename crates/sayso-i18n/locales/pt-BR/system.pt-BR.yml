_version: 1

# Text in files that the system shows, outside the app: the macOS prompt for
# the microphone, the Linux desktop entry, and the Linux app store entry.
# scripts/i18n-system-files.py writes these files from this catalog.
system:
  microphone_usage: "O Sayso escuta o microfone somente enquanto você dita. A fala é transcrita neste Mac."
  system_audio_usage: "O Sayso grava o som de outros apps e chamadas apenas para um app que você permitiu, enquanto esse app grava."
  generic_name: "Ditado por voz"
  comment: "Fale e o Sayso escreve o texto no app que você usa"
  # Search words, separated by ";", with a ";" at the end. Keep "whisper"
  # and "parakeet" (model names) and add words people use in the language.
  keywords: "ditado;voz;fala;transcrição;transcrever;whisper;parakeet;"
  toggle_action: "Iniciar ou parar o ditado"
  summary: "Ditado por voz local em qualquer app"
  description: "Pressione uma tecla, fale e o Sayso escreve o texto no app que você usa. O reconhecimento de voz roda no seu computador. Nada sai dele, a menos que você escolha um modelo na nuvem ou um estilo de IA com um provedor na nuvem."
