_version: 1

# Text from sayso-core that the interface shows.
core:
  models:
    many_languages: "Many languages"
    languages:
      one: "%{count} language"
      other: "%{count} languages"
  # The descriptions of the local models in the Models page and onboarding.
  model:
    parakeet_unified_en: "Fast and accurate for English. One model for the live preview and the final text."
    parakeet_ultra: "The best local model for European languages. As fast as Parakeet v3 and more accurate."
    fluid_speech_mini: "A small, fast English Parakeet."
    parakeet_tdt_v3: "European languages. A smaller download than Ultra."
    parakeet_redux: "The smallest multilingual Parakeet. The first start takes about six minutes."
    parakeet_tdt_v2: "The earlier English Parakeet."
    phonon_2: "A compact Parakeet v3 for English. The first start takes about a minute."
    parakeet_tdt_ctc_110m: "Small and quick, for older Macs."
    parakeet_ja: "A Parakeet model trained for Japanese."
    parakeet_eou_120m: "Small and very fast. No punctuation or capitals."
    whisper_large_v3_turbo: "Nearly as accurate as large-v3 and much faster."
    whisper_large_v3: "Good with strong accents and mixed language. Slow first start."
    whisper_large_v2: "The earlier large model. Some languages work better with it."
    whisper_distil_large_v3: "Close to large-v3 accuracy at several times the speed."
    whisper_medium: "Between small and large. A large download."
    whisper_small: "Lower accuracy. Good for a quick try."
    whisper_base: "Small and fast, with many mistakes."
    whisper_tiny: "The smallest model. For tests and very old Macs."
    apple_speech: "The speech model of macOS. Fast. macOS downloads a language when you first use it."
    nemotron_multilingual: "Live preview and final pass with one model, in many languages."
    nemotron_en: "Live preview and final pass with one streaming model."
    cohere_transcribe: "Very accurate, in 14 languages. The first dictation after a download takes about a minute. Set the language in Settings."
    canary_1b_v2: "A beta conversion. Slower than Parakeet."
    sensevoice_small: "Very fast. Strongest in Chinese, Cantonese, English, Japanese, and Korean."
    paraformer_zh: "Mandarin only. Very fast."
    parakeet_tdt_v3_portable: "Fast and accurate on the processor of this computer. English and 24 European languages. Shows your words live while you speak."
    parakeet_tdt_v2_portable: "The English Parakeet. Shows your words live while you speak."
    whisper_large_v3_turbo_portable: "Nearly as accurate as large-v3 and much faster. Quantized to 5 bits."
    whisper_large_v3_portable: "Good with strong accents and mixed language. Slow without a fast processor. Quantized to 5 bits."
    whisper_medium_portable: "Between small and large. Quantized to 5 bits."
    whisper_tiny_portable: "The smallest model. For tests and very old computers."
    parakeet_tdt_v2_onnx: "Fast and accurate for English. Shows your words live while you speak."
    fluid_speech_mini_onnx: "A small, fast English Parakeet that runs on the graphics card. Shows your words live while you speak."
    parakeet_tdt_v3_onnx: "25 European languages, with automatic detection."
    parakeet_tdt_ctc_110m_onnx: "Small and quick, for older computers."
    kroko_en: "Small live preview for models that have none."
    whisper_large_v3_turbo_onnx: "Many languages and strong accents. Slow on the CPU."
    whisper_distil_large_v3_onnx: "Close to large-v3 accuracy for English at several times the speed."
    moonshine_base_en: "A small English model made for live speech. Very fast."
  speech:
    custom_endpoint: "Custom endpoint"
    runs_on_provider: "Runs on the provider's servers."
    runs_on_own_server: "Runs on your own server."
    # The models that Sayso offers for each speech provider.
    model:
      gpt_4o_transcribe: "High accuracy in many languages."
      gpt_4o_mini_transcribe: "Faster and cheaper, a little less accurate."
      gpt_transcribe: "OpenAI's newest transcription model."
      whisper_1: "Whisper large-v2 on OpenAI's servers."
      whisper_large_v3_turbo: "Very fast. The cheapest cloud choice."
      whisper_large_v3: "More accurate than turbo, still fast."
      voxtral_mini_latest: "13 languages. Takes dictionary words."
      scribe_v2: "High accuracy in many languages. Takes dictionary words."
      nova_3: "Fast, with strong accuracy. Takes dictionary words."
      nova_2: "The earlier Nova model. More languages."
      universal_3_5_pro: "For dictations up to two minutes. Takes dictionary words."
    error:
      timeout: "%{provider} did not answer in %{seconds} s. Check your connection, then try again."
      no_address: "%{provider} is not set up: no address is set. Open Models to fix it."
      no_api_key: "%{provider} is not set up: no API key is saved. Open Models to fix it."
      key_refused: "%{provider} did not accept the API key. Enter a new key in Models."
      rate_limit: "%{provider} is over its rate limit or out of credit. Try again later."
      http: "%{provider} returned HTTP %{status}."
      http_message: "%{provider} returned HTTP %{status}: %{message}"
      network: "Sayso could not reach %{provider}. Check your connection, then try again."
      invalid_response: "%{provider} sent an answer Sayso could not read."
  # The inks of Settings › Appearance and of the style editor.
  ink:
    sumi: "Sumi"
    indigo: "Indigo"
    iron_gall: "Iron Gall"
    sepia: "Sepia"
    verdigris: "Verdigris"
    oxblood: "Oxblood"
