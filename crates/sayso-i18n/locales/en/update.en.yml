_version: 1

# The update status in Settings › General, the Hub sidebar, and the popover.
# Text in "quotes" such as "flatpak install --user" is a command: keep it.
update:
  action:
    check: "Check for updates"
    update_now: "Update now"
    show_in_finder: "Show in Finder"
    how_to_update: "How to update"
    download: "Download"
    cancel: "Cancel"
    restart: "Restart to update"
    open_download_page: "Open the download page"
    try_again: "Try again"
    see_why: "See why"
  up_to_date: "Sayso is up to date"
  version: "Version %{version}"
  never_checked: "Version %{version}. Sayso did not check yet."
  last_check_unknown: "Version %{version}. Last check at an unknown time."
  last_check_today: "Version %{version}. Last check today at %{time}."
  last_check_date: "Version %{version}. Last check on %{date} at %{time}."
  checking: "Checking for updates…"
  available: "Sayso %{version} is available"
  you_have: "You have %{version}."
  wrong_folder: "Sayso cannot update itself from this folder. Move Sayso to the Applications folder, then open it again."
  no_permission: "You have %{version}. Sayso cannot write to its folder, so it cannot update itself. Download the new version and install it."
  no_exchange: "You have %{version}. The disk of Sayso cannot replace an app in one step, so Sayso cannot update itself. Download the new version and install it."
  unsupported: "You have %{version}. Download the new version and install it."
  packaged_appimage: "You have %{version}. Download the new AppImage and use it in place of this one."
  packaged_flatpak: "You have %{version}. Download the new Flatpak file. Then install it as you installed this one: \"flatpak install --user\" and the file, or without \"--user\" for an install for all users."
  packaged_aur: "You have %{version}. Update the AUR package with your AUR helper, for example \"yay -S sayso-bin\". The package can get the new version some time after the release."
  packaged_nix: "You have %{version}. Get the new version with Nix. In a system configuration, update the flake input of Sayso and build the system again. With \"nix run\", add \"--refresh\". The flake can get the new version some time after the release."
  downloading: "Downloading Sayso %{version}"
  downloading_short: "Downloading %{version}"
  downloaded: "%{received} of %{total}"
  megabytes: "%{number} MB"
  preparing: "Preparing Sayso %{version}…"
  preparing_short: "Preparing %{version}…"
  preparing_detail: "Sayso unpacks the new version and checks its signature."
  ready: "Sayso %{version} is ready to install"
  ready_short: "Sayso %{version} is ready"
  ready_detail: "Sayso closes and opens again. This takes a few seconds."
  newer_available: "A newer Sayso is available"
  unreadable_detail: "Version %{version} cannot read the update information. Download the new version and install it."
  failed: "Sayso could not update"
  # Why an update did not succeed. "error" is the text of the system.
  failure:
    unknown: "The update failed."
    busy: "Another Sayso runs from this app. Quit it, then try again."
    cannot_update_itself: "This install cannot update itself."
    nothing_staged: "No update is ready to install."
    not_installed: "Sayso could not install the update. You still have the version from before."
    bad_signature: "The update record does not have a signature of Sayso."
    moved: "Sayso moved to another folder after the update was prepared."
    not_newer: "The prepared update is not newer than this version."
    staging_gone: "The prepared update is gone."
    write_record: "Sayso could not write the update record: %{error}."
    exchange: "Sayso could not replace the app: %{error}"
    relaunch: "Sayso could not start the new version: %{error}. You still have the version from before."
    relaunch_and_restore: "Sayso could not start the new version: %{error}. It could not put the old version back: %{back}. Install Sayso again from the download page."
    unreachable: "Sayso could not reach the update server. Check your connection, then try again. (%{error})"
    check_failed: "Sayso could not get the update information: %{error}. Try again later."
    not_accepted: "Sayso did not accept the update information: %{error}."
    replayed: "The update server offered version %{version}, which is older than a version that Sayso saw before. Try again later."
    mismatch: "The file that Sayso downloaded is not the file of the release. Try again later."
    disk: "Sayso could not write the file: %{error}. Make sure that the disk has free space, then try again."
    download: "Sayso could not download the update: %{error}. Check your connection, then try again."
    prepare: "Sayso could not prepare the update: %{error}."
  tooltip: "%{headline}. %{label}"
  slip_title: "Update available"
  slip_version: "Sayso %{version}"
  slip_newer: "A newer Sayso"
  now_version: "Sayso is now %{version}"
  whats_new: "What is new"
  dismiss: "Dismiss"
  # "Restart to update" while an app records or transcribes.
  waits_for_app: "Sayso restarts to update when %{app} stops."
