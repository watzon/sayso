_version: 1

# Text in files that the system shows, outside the app: the macOS prompt for
# the microphone, the Linux desktop entry, and the Linux app store entry.
# scripts/i18n-system-files.py writes these files from this catalog.
system:
  microphone_usage: "Sayso listens to the microphone only while you dictate. Speech is transcribed on this Mac."
  system_audio_usage: "Sayso records the sound of other apps and calls only for an app that you allowed, while that app records."
  generic_name: "Voice Dictation"
  comment: "Speak, and Sayso writes the text into the app you use"
  # Search words, separated by ";", with a ";" at the end. Keep "whisper"
  # and "parakeet" (model names) and add words people use in the language.
  keywords: "dictation;speech;voice;transcription;whisper;parakeet;"
  toggle_action: "Start or Stop Dictation"
  summary: "Local voice dictation into any app"
  description: "Press a key, speak, and Sayso writes the text into the app you use. Speech recognition runs on your computer. Nothing leaves it unless you choose a cloud model or an AI style with a cloud provider."
