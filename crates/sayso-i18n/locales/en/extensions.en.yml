_version: 1

# The question that an extension asks before it downloads a model.
extensions:
  download_ask:
    window_title: "Download a model"
    title: "%{extension} wants to download a model"
    body: "If you agree, Sayso downloads %{model} (%{size}) to this computer."
    reason_label: "Reason from %{extension}"
    download: "Download"
    cancel: "Cancel"
  # The question before Sayso quits while an extension records or transcribes.
  quit_ask:
    window_title: "Quit Sayso"
    recording: "%{extension} is recording. Quit anyway?"
    transcribing: "%{extension} is transcribing a file. Quit anyway?"
    body: "If you quit, this work stops, and the extension cannot finish it."
    others_label: "Other extensions that work now"
    cancel: "Cancel"
    quit: "Quit"
