_version: 1

# Text in files that the system shows, outside the app: the macOS prompt for
# the microphone, the Linux desktop entry, and the Linux app store entry.
# scripts/i18n-system-files.py writes these files from this catalog.
system:
  microphone_usage: "Sayso는 받아쓰기를 하는 동안에만 마이크를 사용해요. 음성은 이 Mac에서 전사돼요."
  system_audio_usage: "Sayso는 허용한 앱이 녹음하는 동안에만 그 앱을 위해 다른 앱과 통화의 소리를 녹음합니다."
  generic_name: "음성 받아쓰기"
  comment: "말하면 Sayso가 사용 중인 앱에 텍스트를 써 줘요"
  # Search words, separated by ";", with a ";" at the end. Keep "whisper"
  # and "parakeet" (model names) and add words people use in the language.
  keywords: "받아쓰기;음성;음성 입력;음성 인식;전사;딕테이션;dictation;speech;voice;transcription;whisper;parakeet;"
  toggle_action: "받아쓰기 시작 또는 중지"
  summary: "모든 앱에서 쓰는 로컬 음성 받아쓰기"
  description: "키를 누르고 말하면 Sayso가 사용 중인 앱에 텍스트를 써 줘요. 음성 인식은 내 컴퓨터에서 실행돼요. 클라우드 모델이나 클라우드 제공업체의 AI 스타일을 직접 선택하지 않는 한 어떤 데이터도 밖으로 나가지 않아요."
