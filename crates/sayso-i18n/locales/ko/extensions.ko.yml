_version: 1

# The question that an extension asks before it downloads a model.
extensions:
  download_ask:
    window_title: "모델 다운로드"
    title: "%{extension}에서 모델을 다운로드하려고 해요"
    body: "동의하면 Sayso가 %{model}(%{size})을(를) 이 컴퓨터에 다운로드해요."
    reason_label: "%{extension}의 사유"
    download: "다운로드"
    cancel: "취소"
  # The question before Sayso quits while an extension records or transcribes.
  quit_ask:
    window_title: "Sayso 종료"
    recording: "%{extension}에서 녹음하고 있어요. 그래도 종료할까요?"
    transcribing: "%{extension}에서 파일을 받아쓰고 있어요. 그래도 종료할까요?"
    body: "종료하면 이 작업이 멈추고, 확장 프로그램은 작업을 끝낼 수 없어요."
    others_label: "지금 작업 중인 다른 확장 프로그램"
    cancel: "취소"
    quit: "종료"
