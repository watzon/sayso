_version: 1

# The question that an app asks before it downloads a model.
apps:
  download_ask:
    window_title: "모델 다운로드"
    title: "%{app}에서 모델을 다운로드하려고 해요"
    body: "동의하면 Sayso가 %{model}(%{size})을(를) 이 컴퓨터에 다운로드해요."
    reason_label: "%{app}의 사유"
    download: "다운로드"
    cancel: "취소"
  # The question before Sayso quits while an app records or transcribes.
  quit_ask:
    window_title: "Sayso 종료"
    recording: "%{app}에서 녹음하고 있어요. 그래도 종료할까요?"
    transcribing: "%{app}에서 파일을 받아쓰고 있어요. 그래도 종료할까요?"
    body: "종료하면 이 작업이 멈추고, 앱이 작업을 끝낼 수 없어요."
    others_label: "지금 작업 중인 다른 앱"
    cancel: "취소"
    quit: "종료"
  # The approval question: an app asks to use Sayso.
  approval:
    window_title: "앱 허용"
    title: "%{app}에서 Sayso를 사용하려고 해요"
    title_more: "%{app}에서 더 많은 권한을 요청해요"
    body: "Sayso가 실행되는 동안 이 앱은 음성 모델을 쓰고 Sayso를 통해 녹음할 수 있어요. 신뢰하는 앱만 허용하세요."
    body_more: "이미 허용한 앱이에요. 거부하면 지금 가진 권한만 유지돼요."
    signed_by: "%{org}에서 서명함"
    signed: "서명됨"
    not_signed: "서명 없음"
    interpreter: "스크립트 인터프리터예요. 허용하면 실행하는 모든 스크립트가 같은 권한을 받아요."
    claimed: "앱이 자신을 “%{name}”(이)라고 불러요."
    asks_to: "요청 내용"
    allow: "허용"
    dont_allow: "허용 안 함"
  # What an app can do, in plain words.
  capability:
    models_read: "음성 모델 목록 보기"
    audio_mic: "마이크로 녹음하기"
    audio_system: "다른 앱과 통화의 소리 녹음하기"
    transcribe_file: "파일 받아쓰기"
    session_live: "실시간 오디오를 텍스트로 바꾸기"
    models_download: "음성 모델 다운로드 요청하기"
    ai_enhance: "AI 제공업체로 텍스트 다듬기"
    dictation_observe: "삽입된 받아쓰기 내용을 모두 보기"
  # Settings, Connected apps.
  settings:
    title: "연결된 앱"
    subtitle: "Sayso의 음성 모델과 마이크를 쓰는 앱이에요. 모든 앱이 먼저 허락을 구했어요."
    empty: "아직 앱이 없어요. 앱이 Sayso 사용을 요청하면 여기에 표시돼요."
    recording: "녹음 중"
    remove: "제거"
    not_allowed: "허용하지 않은 앱"
    allow: "허용"
    forget: "지우기"
    said_no: "%{date}에 거부했어요"
    said_no_undated: "거부했어요"
    no_capabilities: "이 앱은 더 요청한 것이 없어요. 음성 모델 목록을 볼 수 있어요."
    broken: "Sayso가 %{path} 파일을 읽을 수 없어서 앱을 연결할 수 없어요. 파일을 고치거나 삭제한 뒤 앱을 다시 연결하세요."
    save_failed: "Sayso가 이 변경 사항을 %{path}에 저장하지 못했어요. Sayso가 폴더에 쓸 수 있는지 확인한 뒤 다시 시도하세요."
    show_app: "%{app} 보기"
  # The menu bar and the popover while an app records.
  recording:
    row: "%{app}에서 녹음 중"
    mic: "마이크"
    system: "시스템 오디오"
    both: "마이크와 시스템 오디오"
    stop: "중지"
