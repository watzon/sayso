    parakeet_tdt_v2_portable: "Le Parakeet anglais. Affiche vos mots en direct pendant que vous parlez."
    whisper_large_v3_turbo_portable: "Presque aussi précis que large-v3, et bien plus rapide. Quantifié sur 5 bits."
    whisper_large_v3_portable: "Efficace avec les accents marqués et les langues mélangées. Lent sans processeur rapide. Quantifié sur 5 bits."
    whisper_medium_portable: "Entre small et large. Quantifié sur 5 bits."
    whisper_tiny_portable: "Le plus petit modèle. Pour les tests et les très vieux ordinateurs."
    parakeet_tdt_v2_onnx: "Rapide et précis pour l’anglais. Affiche vos mots en direct pendant que vous parlez."
    fluid_speech_mini_onnx: "Un petit Parakeet rapide pour l’anglais, qui tourne sur la carte graphique. Affiche vos mots en direct pendant que vous parlez."
