    parakeet_tdt_ctc_110m_onnx: "Petit et rapide, pour les ordinateurs plus anciens."
    kroko_en: "Petit aperçu en direct pour les modèles qui n’en ont pas."
    whisper_large_v3_turbo_onnx: "Nombreuses langues et accents marqués. Lent sur le processeur."
    whisper_distil_large_v3_onnx: "Précision proche de large-v3 pour l’anglais, plusieurs fois plus rapide."
    moonshine_base_en: "Un petit modèle anglais conçu pour la parole en direct. Très rapide."
  speech:
    custom_endpoint: "Point de terminaison personnalisé"
    runs_on_provider: "S’exécute sur les serveurs du fournisseur."
    runs_on_own_server: "S’exécute sur votre propre serveur."
    # The models that Sayso offers for each speech provider.
    model:
      gpt_4o_transcribe: "Grande précision dans de nombreuses langues."
      gpt_4o_mini_transcribe: "Plus rapide et moins cher, un peu moins précis."
      gpt_transcribe: "Le modèle de transcription le plus récent d’OpenAI."
      whisper_1: "Whisper large-v2 sur les serveurs d’OpenAI."
      whisper_large_v3_turbo: "Très rapide. Le choix cloud le moins cher."
      whisper_large_v3: "Plus précis que turbo, et toujours rapide."
      voxtral_mini_latest: "13 langues. Prend en compte les mots du dictionnaire."
      scribe_v2: "Grande précision dans de nombreuses langues. Prend en compte les mots du dictionnaire."
      nova_3: "Rapide et très précis. Prend en compte les mots du dictionnaire."
      nova_2: "Le modèle Nova précédent. Plus de langues."
      universal_3_5_pro: "Pour des dictées jusqu’à deux minutes. Prend en compte les mots du dictionnaire."
    error:
      timeout: "%{provider} n’a pas répondu en %{seconds} s. Vérifiez votre connexion, puis réessayez."
      no_address: "%{provider} n’est pas configuré : aucune adresse n’est définie. Ouvrez Modèles pour corriger."
      no_api_key: "%{provider} n’est pas configuré : aucune clé API n’est enregistrée. Ouvrez Modèles pour corriger."
      key_refused: "%{provider} a refusé la clé API. Saisissez une nouvelle clé dans Modèles."
      rate_limit: "%{provider} a atteint sa limite de requêtes ou n’a plus de crédit. Réessayez plus tard."
      http: "%{provider} a renvoyé HTTP %{status}."
      http_message: "%{provider} a renvoyé HTTP %{status} : %{message}"
      network: "Sayso n’a pas pu joindre %{provider}. Vérifiez votre connexion, puis réessayez."
      invalid_response: "%{provider} a envoyé une réponse que Sayso n’a pas pu lire."
  # The inks of Settings › Appearance and of the style editor.
  ink:
    sumi: "Sumi"
    indigo: "Indigo"
    iron_gall: "Iron Gall"
    sepia: "Sepia"
    verdigris: "Verdigris"
    oxblood: "Oxblood"
