_version: 1

# Text from sayso-core that the interface shows.
core:
  models:
    many_languages: "Nombreuses langues"
    languages:
      one: "%{count} langue"
      many: "%{count} de langues"
      other: "%{count} langues"
  # The descriptions of the local models in the Models page and onboarding.
  model:
    parakeet_unified_en: "Rapide et précis pour l’anglais. Un seul modèle pour l’aperçu en direct et le texte final."
    parakeet_ultra: "Le meilleur modèle local pour les langues européennes. Aussi rapide que Parakeet v3, et plus précis."
    fluid_speech_mini: "Un petit Parakeet anglais, rapide."
    parakeet_tdt_v3: "Langues européennes. Téléchargement plus léger qu’Ultra."
    parakeet_redux: "Le plus petit Parakeet multilingue. Le premier démarrage prend environ six minutes."
    parakeet_tdt_v2: "Le Parakeet anglais précédent."
    phonon_2: "Un Parakeet v3 compact pour l’anglais. Le premier démarrage prend environ une minute."
    parakeet_tdt_ctc_110m: "Petit et rapide, pour les Mac plus anciens."
    parakeet_ja: "Un modèle Parakeet entraîné pour le japonais."
    parakeet_eou_120m: "Petit et très rapide. Sans ponctuation ni majuscules."
    whisper_large_v3_turbo: "Presque aussi précis que large-v3, et bien plus rapide."
