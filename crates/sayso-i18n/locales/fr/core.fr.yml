    whisper_large_v2: "Le grand modèle précédent. Certaines langues fonctionnent mieux avec lui."
    whisper_distil_large_v3: "Précision proche de large-v3, plusieurs fois plus rapide."
    whisper_medium: "Entre small et large. Gros téléchargement."
    whisper_small: "Précision plus faible. Pratique pour un essai rapide."
    whisper_base: "Petit et rapide, avec beaucoup d’erreurs."
    whisper_tiny: "Le plus petit modèle. Pour les tests et les très vieux Mac."
    apple_speech: "Le modèle vocal de macOS. Rapide. macOS télécharge une langue à sa première utilisation."
    nemotron_multilingual: "Aperçu en direct et passe finale avec un seul modèle, en de nombreuses langues."
    nemotron_en: "Aperçu en direct et passe finale avec un seul modèle de streaming."
    cohere_transcribe: "Très précis, en 14 langues. La première dictée après un téléchargement prend environ une minute. Définissez la langue dans Réglages."
    canary_1b_v2: "Une conversion bêta. Plus lent que Parakeet."
    sensevoice_small: "Très rapide. Excellent en chinois, cantonais, anglais, japonais et coréen."
    paraformer_zh: "Mandarin uniquement. Très rapide."
