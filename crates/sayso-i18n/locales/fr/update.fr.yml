_version: 1

# The update status in Settings › General, the Hub sidebar, and the popover.
# Text in "quotes" such as "flatpak install --user" is a command: keep it.
update:
  action:
    check: "Rechercher des mises à jour"
    update_now: "Mettre à jour"
    show_in_finder: "Afficher dans le Finder"
    how_to_update: "Comment mettre à jour"
    download: "Télécharger"
    cancel: "Annuler"
    restart: "Redémarrer pour mettre à jour"
    open_download_page: "Ouvrir la page de téléchargement"
    try_again: "Réessayer"
    see_why: "Voir pourquoi"
  up_to_date: "Sayso est à jour"
  version: "Version %{version}"
  never_checked: "Version %{version}. Sayso n’a pas encore vérifié."
  last_check_unknown: "Version %{version}. Dernière vérification à un moment inconnu."
  last_check_today: "Version %{version}. Dernière vérification aujourd’hui à %{time}."
  last_check_date: "Version %{version}. Dernière vérification le %{date} à %{time}."
  checking: "Recherche de mises à jour…"
  available: "Sayso %{version} est disponible"
  you_have: "Vous avez la version %{version}."
  wrong_folder: "Sayso ne peut pas se mettre à jour depuis ce dossier. Déplacez Sayso dans le dossier Applications, puis rouvrez-le."
  no_permission: "Vous avez la version %{version}. Sayso ne peut pas écrire dans son dossier, donc il ne peut pas se mettre à jour. Téléchargez la nouvelle version et installez-la."
  no_exchange: "Vous avez la version %{version}. Le disque de Sayso ne peut pas remplacer une app en une seule étape, donc Sayso ne peut pas se mettre à jour. Téléchargez la nouvelle version et installez-la."
  unsupported: "Vous avez la version %{version}. Téléchargez la nouvelle version et installez-la."
