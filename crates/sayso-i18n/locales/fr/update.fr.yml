  packaged_aur: "Vous avez la version %{version}. Mettez à jour le paquet AUR avec votre assistant AUR, par exemple \"yay -S sayso-bin\". Le paquet peut recevoir la nouvelle version un certain temps après la publication."
  packaged_nix: "Vous avez la version %{version}. Obtenez la nouvelle version avec Nix. Dans une configuration système, mettez à jour l’entrée flake de Sayso et reconstruisez le système. Avec \"nix run\", ajoutez \"--refresh\". Le flake peut recevoir la nouvelle version un certain temps après la publication."
  downloading: "Téléchargement de Sayso %{version}"
  downloading_short: "Téléchargement de %{version}"
  downloaded: "%{received} sur %{total}"
  megabytes: "%{number} Mo"
  preparing: "Préparation de Sayso %{version}…"
  preparing_short: "Préparation de %{version}…"
  preparing_detail: "Sayso décompresse la nouvelle version et vérifie sa signature."
  ready: "Sayso %{version} est prêt à être installé"
  ready_short: "Sayso %{version} est prêt"
  ready_detail: "Sayso se ferme et se rouvre. Cela prend quelques secondes."
  newer_available: "Une version plus récente de Sayso est disponible"
  unreadable_detail: "La version %{version} ne peut pas lire les informations de mise à jour. Téléchargez la nouvelle version et installez-la."
  failed: "Sayso n’a pas pu se mettre à jour"
  # Why an update did not succeed. "error" is the text of the system.
  failure:
    unknown: "La mise à jour a échoué."
    busy: "Un autre Sayso s’exécute depuis cette app. Quittez-le, puis réessayez."
    cannot_update_itself: "Cette installation ne peut pas se mettre à jour."
    nothing_staged: "Aucune mise à jour n’est prête à être installée."
    not_installed: "Sayso n’a pas pu installer la mise à jour. Vous avez toujours la version précédente."
    bad_signature: "L’enregistrement de la mise à jour n’a pas de signature de Sayso."
    moved: "Sayso a changé de dossier après la préparation de la mise à jour."
    not_newer: "La mise à jour préparée n’est pas plus récente que cette version."
    staging_gone: "La mise à jour préparée a disparu."
    write_record: "Sayso n’a pas pu écrire l’enregistrement de la mise à jour : %{error}."
    exchange: "Sayso n’a pas pu remplacer l’app : %{error}"
    relaunch: "Sayso n’a pas pu démarrer la nouvelle version : %{error}. Vous avez toujours la version précédente."
    relaunch_and_restore: "Sayso n’a pas pu démarrer la nouvelle version : %{error}. Il n’a pas pu remettre l’ancienne version : %{back}. Installez Sayso à nouveau depuis la page de téléchargement."
    unreachable: "Sayso n’a pas pu joindre le serveur de mise à jour. Vérifiez votre connexion, puis réessayez. (%{error})"
    check_failed: "Sayso n’a pas pu obtenir les informations de mise à jour : %{error}. Réessayez plus tard."
    not_accepted: "Sayso n’a pas accepté les informations de mise à jour : %{error}."
    replayed: "Le serveur de mise à jour a proposé la version %{version}, plus ancienne qu’une version que Sayso a déjà vue. Réessayez plus tard."
    mismatch: "Le fichier que Sayso a téléchargé n’est pas celui de la version publiée. Réessayez plus tard."
    disk: "Sayso n’a pas pu écrire le fichier : %{error}. Vérifiez que le disque a de l’espace libre, puis réessayez."
    download: "Sayso n’a pas pu télécharger la mise à jour : %{error}. Vérifiez votre connexion, puis réessayez."
    prepare: "Sayso n’a pas pu préparer la mise à jour : %{error}."
  tooltip: "%{headline}. %{label}"
  slip_title: "Mise à jour disponible"
  slip_version: "Sayso %{version}"
  slip_newer: "Un Sayso plus récent"
  now_version: "Sayso est maintenant en version %{version}"
  whats_new: "Nouveautés"
  dismiss: "Ignorer"
  # "Restart to update" while an extension records or transcribes.
  waits_for_extension: "Sayso redémarrera pour se mettre à jour quand %{extension} aura terminé."
