_version: 1

# The question that an extension asks before it downloads a model.
extensions:
  download_ask:
    window_title: "Télécharger un modèle"
    title: "%{extension} souhaite télécharger un modèle"
    body: "Si vous acceptez, Sayso télécharge %{model} (%{size}) sur cet ordinateur."
    reason_label: "Raison donnée par %{extension}"
    download: "Télécharger"
    cancel: "Annuler"
  # The question before Sayso quits while an extension records or transcribes.
  quit_ask:
    window_title: "Quitter Sayso"
    recording: "%{extension} enregistre. Quitter quand même ?"
    transcribing: "%{extension} transcrit un fichier. Quitter quand même ?"
    body: "Si vous quittez, ce travail s’arrête et l’extension ne peut pas le terminer."
    others_label: "Autres extensions en cours de travail"
    cancel: "Annuler"
    quit: "Quitter"
