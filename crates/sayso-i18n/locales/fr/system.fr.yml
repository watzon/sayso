_version: 1

# Text in files that the system shows, outside the app: the macOS prompt for
# the microphone, the Linux desktop entry, and the Linux app store entry.
# scripts/i18n-system-files.py writes these files from this catalog.
system:
  microphone_usage: "Sayso n’écoute le microphone que pendant que vous dictez. La parole est transcrite sur ce Mac."
  system_audio_usage: "Sayso enregistre le son des autres apps et des appels uniquement pour une app que vous avez autorisée, pendant qu’elle enregistre."
  generic_name: "Dictée vocale"
  comment: "Parlez, et Sayso écrit le texte dans l’app que vous utilisez"
  # Search words, separated by ";", with a ";" at the end. Keep "whisper"
  # and "parakeet" (model names) and add words people use in the language.
  keywords: "dictée;dicter;voix;parole;reconnaissance vocale;transcription;saisie vocale;whisper;parakeet;"
  toggle_action: "Démarrer ou arrêter la dictée"
  summary: "Dictée vocale locale dans n’importe quelle app"
  description: "Appuyez sur une touche, parlez, et Sayso écrit le texte dans l’app que vous utilisez. La reconnaissance vocale s’exécute sur votre ordinateur. Rien ne le quitte, sauf si vous choisissez un modèle cloud ou un style IA avec un fournisseur cloud."
