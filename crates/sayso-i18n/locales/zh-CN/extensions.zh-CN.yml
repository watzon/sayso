_version: 1

# The question that an extension asks before it downloads a model.
extensions:
  download_ask:
    window_title: "下载模型"
    title: "%{extension} 想要下载一个模型"
    body: "如果你同意，Sayso 会把 %{model}（%{size}）下载到这台电脑。"
    reason_label: "来自 %{extension} 的理由"
    download: "下载"
    cancel: "取消"
  # The question before Sayso quits while an extension records or transcribes.
  quit_ask:
    window_title: "退出 Sayso"
    recording: "%{extension} 正在录音。仍要退出吗？"
    transcribing: "%{extension} 正在转写文件。仍要退出吗？"
    body: "退出后，此工作会停止，扩展无法完成它。"
    others_label: "正在工作的其他扩展"
    cancel: "取消"
    quit: "退出"
