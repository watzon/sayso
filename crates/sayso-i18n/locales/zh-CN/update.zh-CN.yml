    disk: "Sayso 无法写入文件：%{error}。请确保磁盘有可用空间，然后重试。"
    download: "Sayso 无法下载更新：%{error}。请检查网络连接，然后重试。"
    prepare: "Sayso 无法准备更新：%{error}。"
  tooltip: "%{headline}。%{label}"
  slip_title: "有可用更新"
  slip_version: "Sayso %{version}"
  slip_newer: "更新版本的 Sayso"
  now_version: "Sayso 现在的版本为 %{version}"
  whats_new: "新功能"
  dismiss: "关闭"
