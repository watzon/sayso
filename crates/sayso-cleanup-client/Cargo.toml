[package]
name = "sayso-cleanup-client"
description = "Runs Sayso cleanup models: starts the cleanup runtime as a separate program, talks to it, and downloads the model files."
version.workspace = true
edition.workspace = true
# The workspace license is GPL-3.0-only. This crate is MIT (docs/adr/0002-mit-sdk-gpl-app.md).
# It starts the runtime as a separate program and never links it.
license = "MIT"
publish = true
repository = "https://github.com/watzon/sayso"
readme = "README.md"

[dependencies]
sayso-cleanup-models.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
ureq = "3"
sha2 = "0.11"
workspace-hack.workspace = true

[dev-dependencies]
tempfile.workspace = true
tiny_http = "0.12"
