[package]
name = "sayso-platform-windows"
description = "Windows implementations of the Sayso platform traits."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sayso-core.workspace = true
sayso-platform.workspace = true

[target.'cfg(windows)'.dependencies]
crossbeam-channel.workspace = true
parking_lot.workspace = true
log.workspace = true
thiserror.workspace = true
serde_json.workspace = true

global-hotkey = "0.8"
cpal = "0.18.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The same version as gpui-pre, so a build compiles it once.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
env_logger.workspace = true
