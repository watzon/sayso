[package]
name = "sayso-engine"
description = "Speech engine sidecar for Linux and Windows: sherpa-onnx models behind the NDJSON engine protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sayso-engine"
path = "src/main.rs"
test = false

# macOS uses the Swift engine (native/macos/SaysoEngine). On macOS this crate
# builds only a stub binary, so these dependencies stay out of macOS builds.
[target.'cfg(not(target_os = "macos"))'.dependencies]
sayso-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
sherpa-onnx = "=1.13.8"
ureq = "3"
bzip2 = "0.6"
tar = "0.4"
base64 = "0.22"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
sayso-engine-client.workspace = true
sayso-platform.workspace = true
crossbeam-channel.workspace = true
tempfile.workspace = true
tiny_http = "0.12"
