[package]
name = "sayso-engine"
description = "Speech engine sidecar for Linux and Windows: sherpa-onnx and parakeet.cpp models behind the NDJSON engine protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["parakeet"]
# parakeet.cpp for the `parakeet_cpp` models (Linux only; build.rs).
parakeet = []

[[bin]]
name = "sayso-engine"
path = "src/main.rs"
test = false

# macOS uses the Swift engine (native/macos/SaysoEngine). On macOS this crate
# builds only a stub binary, so these dependencies stay out of macOS builds.
[target.'cfg(not(target_os = "macos"))'.dependencies]
sayso-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
sherpa-onnx = "=1.13.8"
ureq = "3"
bzip2 = "0.6"
tar = "0.4"
base64 = "0.22"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"

[dependencies]
workspace-hack.workspace = true

# For parakeet.cpp (build.rs). A target table of build dependencies matches the
# host, and each system builds its own release, so these stay out of other builds.
[target.'cfg(target_os = "linux")'.build-dependencies]
cmake = "0.1"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "3"

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
sayso-engine-client.workspace = true
sayso-platform.workspace = true
crossbeam-channel.workspace = true
tempfile.workspace = true
tiny_http = "0.12"
