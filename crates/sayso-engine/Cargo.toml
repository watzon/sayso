[package]
name = "sayso-engine"
description = "Speech engine sidecar for Linux and Windows: sherpa-onnx, parakeet.cpp (Linux), and whisper.cpp (Windows) models behind the NDJSON engine protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["parakeet"]
# parakeet.cpp for the `parakeet_cpp` models (Linux only; build.rs).
parakeet = []
# whisper.cpp for the `whisper_cpp` models. Windows always has it. On Linux the
# feature exists only to test that code; the Linux catalog has no such model.
# It needs --no-default-features there: parakeet.cpp has its own ggml (lib.rs).
whisper-cpp = ["dep:transcribe-rs", "dep:whisper-rs"]

[[bin]]
name = "sayso-engine"
path = "src/main.rs"
test = false

# macOS uses the Swift engine (native/macos/SaysoEngine). On macOS this crate
# builds only a stub binary, so these dependencies stay out of macOS builds.
[target.'cfg(not(target_os = "macos"))'.dependencies]
sayso-core.workspace = true
anyhow.workspace = true
serde_json.workspace = true
ureq = "3"
bzip2 = "0.6"
tar = "0.4"
base64 = "0.22"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2"
# Linked statically.
sherpa-onnx = "=1.13.8"
# The C API for Whisper and SenseVoice (src/sherpa_c.rs). sherpa-onnx picks the
# static or the shared library.
sherpa-onnx-sys = { version = "=1.13.8", default-features = false }
transcribe-rs = { version = "=0.3.12", default-features = false, features = ["whisper-cpp"], optional = true }
# The version that transcribe-rs uses, for the language that whisper.cpp finds.
whisper-rs = { version = "=0.16.0", optional = true }

# The Windows libraries of sherpa-onnx are built with the static C runtime (/MT),
# and whisper.cpp with the DLL one (/MD). One exe cannot link both, so sherpa-onnx
# comes as DLLs (sherpa-onnx-c-api.dll, onnxruntime.dll) that keep their own
# runtime. The release copies them next to the exe (scripts/bundle-windows.ps1).
[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
sherpa-onnx-sys = { version = "=1.13.8", default-features = false }
transcribe-rs = { version = "=0.3.12", default-features = false, features = ["whisper-cpp"] }
whisper-rs = "=0.16.0"

[dependencies]
workspace-hack.workspace = true

# For parakeet.cpp (build.rs). A target table of build dependencies matches the
# host, and each system builds its own release, so these stay out of other builds.
[target.'cfg(target_os = "linux")'.build-dependencies]
cmake = "0.1"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "3"

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
sayso-engine-client.workspace = true
sayso-engine-conformance.workspace = true
sayso-platform.workspace = true
crossbeam-channel.workspace = true
sha2.workspace = true
tempfile.workspace = true
tiny_http = "0.12"
