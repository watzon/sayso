[package]
name = "sayso-enhance"
description = "Sayso AI enhancement providers: OpenAI-compatible HTTP, Claude CLI, Codex CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sayso-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
ureq = { version = "3", features = ["json"] }
wait-timeout = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager.
keyring = { version = "4", features = ["windows-native-keyring-store"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
keyring = "4"

[dev-dependencies]
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The style evaluation runs Apple Intelligence through the real sidecar.
sayso-engine-client.workspace = true
