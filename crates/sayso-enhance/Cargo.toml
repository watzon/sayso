[package]
name = "sayso-enhance"
description = "Sayso AI enhancement providers: OpenAI-compatible HTTP, Claude CLI, ChatGPT plan, ACP agents."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sayso-core.workspace = true
sayso-i18n.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
uuid.workspace = true
sha2.workspace = true
base64 = "0.23"
url = "2"
# The callback of the ChatGPT sign-in.
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
wait-timeout = "0.2"
serde.workspace = true
# The downloads of the ACP registry.
flate2 = "1"
tar = "0.4"
bzip2 = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
workspace-hack.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager.
keyring = { version = "4", features = ["windows-native-keyring-store"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
keyring = "4"

[dev-dependencies]
# The style evaluation also runs the cleanup models through the cleanup runtime.
sayso-cleanup-client.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The style evaluation runs Apple Intelligence through the real sidecar.
sayso-engine-client.workspace = true
