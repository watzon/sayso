[package]
name = "sayso-app"
description = "Sayso: local dictation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sayso"
path = "src/main.rs"

[dependencies]
sayso-core.workspace = true
sayso-platform.workspace = true
sayso-engine-client.workspace = true
sayso-store.workspace = true
sayso-enhance.workspace = true
sayso-transcribe.workspace = true
sayso-ui.workspace = true
sayso-update.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
chrono.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
async-channel = "2"
crossbeam-channel.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sayso-platform-macos.workspace = true
tray-icon = "0.26"
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
sayso-platform-linux.workspace = true
libc = "0.2"

[target.'cfg(windows)'.dependencies]
sayso-platform-windows.workspace = true
tray-icon = "0.26"

# Systems without their own backend yet (see src/shell/fallback.rs).
[target.'cfg(not(any(target_os = "macos", target_os = "linux", windows)))'.dependencies]
sayso-platform-common.workspace = true

[dev-dependencies]
tempfile.workspace = true
