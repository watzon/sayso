[package]
name = "sayso-update"
description = "Sayso updates: the signed update manifest, the update check, and the updater state."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
base64 = "0.22"
ed25519-dalek = "3"
semver = { version = "1", features = ["serde"] }
ureq = "3"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
tiny_http = "0.12"
# The key pair of `examples/update_tool.rs keygen`.
getrandom = "0.3"
