# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Members get `workspace-hack.workspace = true`, like the other internal crates.
workspace-hack-line-style = "workspace-dotted"

# The v2 and v3 resolvers are identical from hakari's point of view.
resolver = "2"

# The platforms Sayso is built and released on (see .github/workflows).
platforms = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Leave GPUI out. With GPUI in workspace-hack, every crate (sayso-core, the
# engine, the updater) would build GPUI. Crates reached only through it are
# left out too.
[traversal-excludes]
third-party = [
    { name = "gpui-kit" },
]

# sayso-bridge links statically and runs outside the Flatpak sandbox, so it
# builds no dependency of the other crates.
[final-excludes]
workspace-members = ["sayso-bridge"]
